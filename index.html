<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10;--bg2:#0e1118;--bg3:#131720;--card:#111520;--card2:#161c2a;
  --border:#1e2d45;--cyan:#00e5ff;--cyan2:#00b8d9;--cyan3:#007ea8;
  --green:#00e676;--yellow:#ffd600;--orange:#ff6d00;--red:#ff1744;
  --purple:#aa00ff;--purple2:#7c00c9;
  --text:#e0f0ff;--text2:#8899bb;--text3:#556688;
  --shadow:0 4px 24px rgba(0,229,255,.08);
  --glow-strong:0 0 32px rgba(0,229,255,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:15px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--cyan3);border-radius:2px;}
#app-header{background:linear-gradient(135deg,#060a12,#0a1428,#060a12);border-bottom:2px solid var(--cyan3);padding:10px 16px 36px;flex-shrink:0;position:relative;overflow:hidden;text-align:center;}
#app-header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(0,229,255,.02) 60px,rgba(0,229,255,.02) 61px);pointer-events:none;}
.header-logo{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;color:var(--cyan);text-shadow:var(--glow-strong);letter-spacing:2px;text-align:center;}
.header-logo span{color:#fff;text-shadow:none;}
.header-tagline{font-family:'Share Tech Mono',monospace;font-size:29px;color:#00b8d9;letter-spacing:1.5px;margin-top:3px;text-transform:uppercase;text-align:center;}
.header-sub{font-size:13px;color:#667788;margin-top:1px;text-align:center;}
.logo-svg{display:block;margin:0 auto;max-width:280px;height:auto;}
#alert-banner{background:transparent;color:var(--orange);padding:0;font-weight:700;font-size:12px;display:none;align-items:center;overflow:hidden;height:26px;flex-shrink:0;border-bottom:1px solid rgba(255,109,0,.2);}
#alert-ticker-wrap{flex:1;overflow:hidden;position:relative;height:26px;}
#alert-ticker{position:absolute;white-space:nowrap;animation:ticker 18s linear infinite;top:4px;}
@keyframes ticker{0%{left:100%;}100%{left:-100%;}}
#alert-pulse{flex-shrink:0;width:8px;height:8px;border-radius:50%;background:var(--orange);animation:pulse 1.2s ease-in-out infinite;margin:0 8px;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(1.4);}}
#tabs-bar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-bottom:2px solid var(--border);flex-shrink:0;}
.tab-btn{padding:9px 2px 7px;background:none;border:none;color:var(--text3);font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;text-align:center;line-height:1.3;}
.tab-btn:nth-child(-n+4){border-bottom:1px solid var(--border);}
.tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan)!important;background:rgba(0,229,255,.07);}
.tab-badge{display:inline-block;background:var(--red);color:#fff;border-radius:8px;font-size:9px;padding:0 4px;margin-left:2px;min-width:14px;text-align:center;font-weight:700;vertical-align:middle;}
.tab-badge.orange{background:var(--orange);}
.tab-badge.gray{background:var(--text3);}
.tab-badge.yellow{background:var(--yellow);color:#000;}
#content{flex:1;overflow-y:auto;padding:12px;padding-bottom:24px;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan3),transparent);opacity:.4;}
.card.green-card::before{background:linear-gradient(90deg,transparent,var(--green),transparent);}
.card.yellow-card::before{background:linear-gradient(90deg,transparent,var(--yellow),transparent);}
.card.red-card{border-color:rgba(255,23,68,.4);}
.card.red-card::before{background:linear-gradient(90deg,transparent,var(--red),transparent);}
.card.orange-card{border-color:rgba(255,109,0,.5);}
.card.orange-card::before{background:linear-gradient(90deg,transparent,var(--orange),transparent);}
.card.purple-card{border-color:rgba(170,0,255,.35);}
.card.purple-card::before{background:linear-gradient(90deg,transparent,var(--purple2),transparent);}
.card.trash-card{border-color:rgba(255,255,255,.1);opacity:.75;}
.card.trash-card::before{background:linear-gradient(90deg,transparent,var(--text3),transparent);}
.card.diag-card{border-color:rgba(255,214,0,.3);}
.card.diag-card::before{background:linear-gradient(90deg,transparent,var(--yellow),transparent);}
.client-card{cursor:pointer;transition:all .2s;}
.client-name{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;}
.client-wa{font-size:13px;color:var(--cyan2);margin-bottom:8px;}
.client-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid transparent;}
.tag.total{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.3);color:var(--cyan);}
.tag.reparo{background:rgba(21,101,192,.2);border-color:rgba(21,101,192,.4);color:#64b5f6;}
.tag.garantia{background:rgba(170,0,255,.1);border-color:rgba(170,0,255,.3);color:#ce93d8;}
.tag.atraso{background:rgba(255,109,0,.15);border-color:rgba(255,109,0,.4);color:var(--orange);}
.client-meta{font-size:12px;color:var(--text3);display:flex;gap:12px;flex-wrap:wrap;}
.robot-num{font-family:'Share Tech Mono',monospace;font-size:22px;font-weight:700;color:var(--cyan);}
.robot-sn{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text2);margin-top:1px;}
.robot-model{font-size:14px;font-weight:700;color:#fff;margin-top:3px;}
.robot-volt{font-size:11px;color:var(--yellow);font-weight:700;margin-top:2px;}
.robot-defects{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;}
.defect-chip{background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.2);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--cyan2);}
.robot-meta{font-size:12px;color:var(--text3);margin-bottom:8px;line-height:1.7;}
.robot-actions{display:flex;gap:6px;flex-wrap:wrap;}
.cliente-label{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.5px;margin-bottom:2px;}
.wa-last{font-size:11px;color:#25d366;margin-bottom:6px;padding:5px 8px;background:rgba(37,211,102,.06);border-left:3px solid rgba(37,211,102,.35);border-radius:0 6px 6px 0;}
.diag-badge{font-size:11px;color:var(--yellow);margin-bottom:6px;padding:5px 8px;background:rgba(255,214,0,.06);border-left:3px solid rgba(255,214,0,.35);border-radius:0 6px 6px 0;font-weight:700;}
.status-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:6px;}
.status-verde{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.4);color:var(--green);}
.status-amarelo{background:rgba(255,214,0,.1);border:1px solid rgba(255,214,0,.4);color:var(--yellow);}
.status-vermelho{background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.4);color:var(--red);}
.status-critico{background:rgba(255,109,0,.15);border:1px solid rgba(255,109,0,.5);color:var(--orange);animation:blink .8s infinite;}
.status-garantia{background:rgba(170,0,255,.1);border:1px solid rgba(170,0,255,.4);color:#ce93d8;}
.status-lixeira{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:var(--text3);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.6;}}
.days-big{font-family:'Share Tech Mono',monospace;font-size:28px;font-weight:700;line-height:1;}
.days-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;}
.garantia-shield{font-size:28px;margin-bottom:4px;}
.garantia-days{font-family:'Share Tech Mono',monospace;font-size:20px;color:var(--purple);font-weight:700;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;border:none;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.btn-cyan{background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.4);color:var(--cyan);}
.btn-green{background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.4);color:var(--green);}
.btn-wa{background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.4);color:#25d366;}
.btn-yellow{background:rgba(255,214,0,.12);border:1px solid rgba(255,214,0,.4);color:var(--yellow);}
.btn-primary{background:linear-gradient(135deg,#007ea8,#005f7f);border:1px solid var(--cyan3);color:#fff;padding:12px 20px;border-radius:10px;font-size:15px;}
.btn-close{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text2);}
.btn-edit{background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.3);color:var(--cyan2);}
.btn-del{background:rgba(255,23,68,.08);border:1px solid rgba(255,23,68,.3);color:var(--red);}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.form-label span{color:var(--red);}
.form-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--cyan3);}
.form-input::placeholder{color:var(--text3);}
.form-input:disabled{opacity:.4;}
textarea.form-input{resize:vertical;min-height:70px;}
select.form-input{cursor:pointer;}
.volt-row{display:flex;gap:8px;flex-wrap:wrap;}
.volt-btn{padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.volt-btn.sel{background:rgba(255,214,0,.12);border-color:rgba(255,214,0,.5);color:var(--yellow);}
.wa-tipos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
.wa-tipo-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.wa-tipo-btn.sel{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.4);color:#25d366;}
.wa-tipo-btn.disabled{opacity:.35;cursor:not-allowed;}
.wa-hist{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:12px;}
.wa-hist-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.wa-hist-item{font-size:12px;color:var(--text2);margin-bottom:3px;}
.qty-selector{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:4px 8px;width:fit-content;}
.qty-btn{width:36px;height:36px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);border-radius:6px;color:var(--cyan);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;}
.qty-val{font-family:'Share Tech Mono',monospace;font-size:22px;color:#fff;min-width:30px;text-align:center;}
.robot-block{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.robot-block-title{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--cyan);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.defect-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.defect-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Rajdhani',sans-serif;}
.defect-btn.sel{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.5);color:var(--cyan);}
.defect-category{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin:10px 0 5px;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
.checkbox-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--cyan);cursor:pointer;}
.checkbox-row label{font-size:13px;color:var(--text2);cursor:pointer;}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;align-items:center;justify-content:center;padding:16px;}
#modal-overlay.open{display:flex;}
.modal{background:var(--card2);border:1px solid var(--cyan3);border-radius:16px;padding:20px;max-width:460px;width:100%;box-shadow:0 0 60px rgba(0,229,255,.15);animation:modal-in .2s ease-out;max-height:92vh;overflow-y:auto;}
@keyframes modal-in{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-title{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:16px;}
.modal-title.danger{color:var(--red);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.section-title{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--cyan2);letter-spacing:2px;text-transform:uppercase;margin:16px 0 10px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--cyan3),transparent);}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;}
.empty-state p{font-size:13px;line-height:1.6;}
.divider{height:1px;background:var(--border);margin:10px 0;}
.back-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;color:var(--cyan);font-weight:700;font-size:14px;}
.trash-info{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text3);margin-bottom:10px;line-height:1.5;}
#ficha-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:500;flex-direction:column;overflow:hidden;}
#ficha-overlay.open{display:flex;}
#ficha-header{background:var(--card2);border-bottom:1px solid var(--border);padding:12px 16px;flex-shrink:0;}
#ficha-content{flex:1;overflow-y:auto;padding:12px;}
#diag-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:600;flex-direction:column;overflow:hidden;}
#diag-overlay.open{display:flex;}
#diag-header{background:var(--card2);border-bottom:2px solid var(--yellow);padding:12px 16px;flex-shrink:0;}
#diag-content{flex:1;overflow-y:auto;padding:12px;}
#config-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:700;flex-direction:column;overflow:hidden;}
#config-overlay.open{display:flex;}
#config-header{background:var(--card2);border-bottom:2px solid var(--cyan3);padding:12px 16px;flex-shrink:0;}
#config-content{flex:1;overflow-y:auto;padding:12px;}
.diag-item-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
.diag-item-row.sel{border-color:var(--yellow);background:rgba(255,214,0,.05);}
.diag-item-check{width:18px;height:18px;accent-color:var(--yellow);cursor:pointer;flex-shrink:0;}
.diag-item-info{flex:1;}
.diag-item-nome{font-size:13px;color:var(--text);font-weight:600;}
.diag-item-preco{width:110px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:13px;text-align:right;outline:none;}
.diag-item-preco:focus{border-color:var(--yellow);}
.abertura-row{display:flex;gap:8px;margin-bottom:4px;}
.abertura-btn{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--bg2);color:var(--text2);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;}
.abertura-btn.sel{border-color:var(--yellow);background:rgba(255,214,0,.1);color:var(--yellow);}
.diag-total-box{background:var(--bg2);border:2px solid var(--cyan3);border-radius:12px;padding:14px;margin:12px 0;}
.diag-total-linha{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:6px;}
.diag-total-linha.total{font-size:16px;font-weight:700;color:#fff;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.diag-total-linha.desconto{color:var(--red);}
.diag-total-linha.avista{color:var(--green);font-weight:700;}
.calc-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;}
.calc-title{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.calc-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.calc-row:last-child{border-bottom:none;}
.calc-label{color:var(--text2);}
.calc-val{font-family:'Share Tech Mono',monospace;color:var(--cyan);font-weight:700;font-size:12px;}
.parcela-btns{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0;}

.config-cat-title{font-size:11px;font-weight:700;color:var(--cyan2);letter-spacing:1px;text-transform:uppercase;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border);}
.config-item-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
.config-item-card.inativo{opacity:.5;}
.config-item-header{display:flex;align-items:center;justify-content:space-between;}
.config-item-nome{font-size:13px;color:var(--text);font-weight:700;}
.config-item-cat{font-size:11px;color:var(--text3);margin-top:2px;}
.config-item-actions{display:flex;gap:5px;flex-shrink:0;}
.config-btn{padding:5px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:700;cursor:pointer;font-family:'Rajdhani',sans-serif;}
.config-btn.edit{border-color:rgba(0,229,255,.3);color:var(--cyan2);}
.config-btn.del{border-color:rgba(255,23,68,.3);color:var(--red);}

.config-btn.toggle.off{border-color:rgba(255,255,255,.1);color:var(--text3);}
.cancel-sel-btn{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--bg2);color:var(--text2);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;}
.cancel-sel-btn.ativo-yellow{border-color:var(--yellow);background:rgba(255,214,0,.1);color:var(--yellow);}
.cancel-sel-btn.ativo-red{border-color:var(--red);background:rgba(255,23,68,.1);color:var(--red);}
.etq-robo-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .2s;}
.etq-robo-row.sel{border-color:var(--cyan);background:rgba(0,229,255,.06);}
.etq-robo-row.impressa{border-color:rgba(0,230,118,.3);background:rgba(0,230,118,.04);}

.etq-robo-info{flex:1;}
.etq-robo-num{font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--cyan);font-weight:700;}
.etq-robo-det{font-size:12px;color:var(--text2);}
.etq-robo-actions{display:flex;gap:6px;flex-shrink:0;}
#etq-overlay{display:none;position:fixed;inset:0;background:#fff;z-index:3000;flex-direction:column;}
#etq-overlay.open{display:flex;}
#etq-toolbar{background:#f0f0f0;border-bottom:2px solid #ccc;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
#etq-body{flex:1;overflow-y:auto;background:#ddd;padding:10px;}
#etq-folha{width:190mm;margin:0 auto;background:#fff;padding:2mm;display:grid;grid-template-columns:repeat(4,47mm);grid-template-rows:auto;gap:1mm;box-sizing:border-box;}
.etq-item{width:47mm;height:28mm;border:0.5px solid #ccc;border-radius:1mm;padding:1mm 0mm 1mm 2mm;display:flex;align-items:stretch;overflow:hidden;box-sizing:border-box;font-family:Arial,sans-serif;background:#fff;color:#000;}
.etq-item.vazia{visibility:hidden;border:none;}
.etq-item-left{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-right:1mm;overflow:hidden;}
.etq-item-right{width:17mm;flex-shrink:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:0;}
.etq-cli{font-size:10pt;font-weight:900;color:#000;line-height:1.1;word-break:break-word;}
.etq-num{font-size:11pt;font-weight:900;color:#000;line-height:1;}
.etq-dat{font-size:6pt;color:#444;margin-top:0.5mm;}
.etq-qr-fixed{width:17mm;height:17mm;display:block;}
.etq-btn-back{background:#555;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:15px;cursor:pointer;font-family:Arial;font-weight:700;}
.etq-btn-print{background:#007ea8;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:15px;cursor:pointer;font-family:Arial;font-weight:700;}
@media print{
  #etq-toolbar{display:none!important;}
  #etq-body{overflow:visible!important;background:#fff!important;padding:0!important;}
  body>*:not(#etq-overlay){display:none!important;}
  #etq-overlay{position:static!important;background:#fff!important;}
  @page{size:A4 portrait;margin:5mm;}
}
/* ── SYNC TOAST CENTRAL ── */
#sync-toast{
  display:none;position:fixed;inset:0;z-index:99999;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  pointer-events:none;
}
#sync-toast.show{display:flex;}
.sync-box{
  background:linear-gradient(135deg,#0e1520,#111d30);
  border:1.5px solid rgba(0,229,255,.4);
  border-radius:20px;
  padding:28px 36px;
  text-align:center;
  box-shadow:0 0 60px rgba(0,229,255,.18),0 8px 40px rgba(0,0,0,.6);
  min-width:200px;
  animation:sync-pop .25s cubic-bezier(.34,1.56,.64,1);
}
@keyframes sync-pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.sync-robot{
  font-size:48px;line-height:1;
  display:inline-block;
  animation:robot-spin 0.7s linear infinite;
  filter:drop-shadow(0 0 12px rgba(0,229,255,.7));
}
@keyframes robot-spin{
  0%{transform:rotate(-15deg) scale(1);}
  25%{transform:rotate(0deg) scale(1.08);}
  50%{transform:rotate(15deg) scale(1);}
  75%{transform:rotate(0deg) scale(1.08);}
  100%{transform:rotate(-15deg) scale(1);}
}
.sync-orbit{
  width:70px;height:70px;
  border-radius:50%;
  border:2px solid rgba(0,229,255,.15);
  border-top-color:var(--cyan);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
  animation:orbit-spin 1.2s linear infinite;
  position:relative;
}
@keyframes orbit-spin{to{transform:rotate(360deg);}}
.sync-orbit-inner{
  width:54px;height:54px;border-radius:50%;
  border:2px solid rgba(0,229,255,.08);
  border-bottom-color:rgba(0,229,255,.5);
  animation:orbit-spin 0.8s linear infinite reverse;
  display:flex;align-items:center;justify-content:center;
  position:absolute;
}
.sync-robot-inner{font-size:26px;animation:robot-spin 0.7s linear infinite;}
.sync-label{
  font-family:'Orbitron',monospace;
  font-size:13px;font-weight:700;
  color:var(--cyan);
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:4px;
}
.sync-sub{font-size:11px;color:var(--text3);letter-spacing:.5px;}
.sync-dots span{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--cyan);margin:0 2px;
  animation:dot-pulse 1.2s ease-in-out infinite;
}
.sync-dots span:nth-child(2){animation-delay:.2s;}
.sync-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dot-pulse{0%,80%,100%{opacity:.2;transform:scale(.8);}40%{opacity:1;transform:scale(1.2);}}
</style>
</head>

<script>
var DB={clientes:[],robos:[],lixeira:[],catalogo:[],defeitosCI:[],osSeq:0};
function showToast(msg,duration){
  var t=document.getElementById('_simple-toast');
  if(!t){t=document.createElement('div');t.id='_simple-toast';
    t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(10,12,16,.92);border:1px solid rgba(0,229,255,.35);color:#00e5ff;padding:10px 22px;border-radius:12px;font-weight:700;font-size:13px;z-index:99998;white-space:nowrap;max-width:92%;text-align:center;pointer-events:none;transition:all .25s;opacity:0;font-family:\'Rajdhani\',sans-serif;letter-spacing:.5px;box-shadow:0 4px 20px rgba(0,0,0,.5);';
    document.body.appendChild(t);}
  t.textContent=msg;clearTimeout(t._tid);
  requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';});
  t._tid=setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(10px)';},duration||3000);
}
var currentTab='clientes',fichaClienteId=null,ciQty=1,ciDefects={},ciTipo='cf';
function setTipoCliente(tipo){
  ciTipo=tipo;
  ['cf','vd','vc'].forEach(function(t){
    var btn=document.getElementById('tipo-'+t);if(!btn)return;
    if(t===tipo){btn.style.background='rgba(0,229,255,.15)';btn.style.borderColor='rgba(0,229,255,.5)';btn.style.color='var(--cyan)';}
    else{btn.style.background='var(--bg2)';btn.style.borderColor='var(--border)';btn.style.color='var(--text3)';}
  });
  var cfGroup=document.getElementById('ci-nome-cliente-final-group');
  if(cfGroup)cfGroup.style.display=(tipo==='vc')?'block':'none';
  var nomeInput=document.getElementById('ci-nome');
  if(nomeInput){
    if(tipo==='vd'||tipo==='vc')nomeInput.placeholder='Ex: João Matheus (vendedor)';
    else nomeInput.placeholder='Ex: Luiz Ferreira';
  }
}
var waTipoAtual='entrada',waMensagens={},waRoboId=null,waParcela=0;
var etqSel=[],etqUsadas=[],etqPosSel=[],etqAba='nao',etqCopias={};
var diagRoboId=null,parcelaSel=2,configEditId=null;

function saveDB(){try{localStorage.setItem('moledo_v5',JSON.stringify(DB));}catch(e){}
  if(window._fbReady)syncToFirebase();
}
function loadDB(){
  try{var r=localStorage.getItem('moledo_v5');if(r)DB=JSON.parse(r);}catch(e){}
  try{var old=localStorage.getItem('moledo_v4');if(old&&!DB.clientes.length){var o=JSON.parse(old);DB.clientes=o.clientes||[];DB.robos=o.robos||[];DB.lixeira=o.lixeira||[];}}catch(e){}
  if(!DB.clientes)DB.clientes=[];if(!DB.robos)DB.robos=[];if(!DB.lixeira)DB.lixeira=[];if(!DB.catalogo)DB.catalogo=[];if(!DB.defeitosCI)DB.defeitosCI=[];if(!DB.osSeq)DB.osSeq=0;
  if(DB.taxas)Object.assign(TAXAS,DB.taxas);
  DB.robos.forEach(function(r){if(!r.mensagens)r.mensagens=[];if(r.diagnostico===undefined)r.diagnostico=null;});
  // MIGRAÇÃO: mover nomeClienteFinal do cliente para o robô (v1)
  if(!DB.migracaoCF){
    DB.clientes.forEach(function(c){
      if(c.nomeClienteFinal&&c.nomeClienteFinal.trim()){
        // pegar todos os robôs desse cliente que não têm nomeClienteFinal
        DB.robos.forEach(function(r){
          if(r.clienteId===c.id&&!r.nomeClienteFinal){
            r.nomeClienteFinal=c.nomeClienteFinal;
          }
        });
        delete c.nomeClienteFinal;
      }
    });
    DB.migracaoCF=true;
    try{localStorage.setItem('moledo_v5',JSON.stringify(DB));}catch(e){}
  }
  if((DB.versaoCatalogo||0)<2){DB.catalogo=CAT_PAD.map(function(x){return Object.assign({id:genId()},x);});DB.versaoCatalogo=2;saveDB();}
  // repopula defeitos do checkin se vazio (inclusive após sync do Firebase)
  if(!DB.defeitosCI||!DB.defeitosCI.length){
    DB.defeitosCI=[];
    DEFEITOS.forEach(function(cat){cat.items.forEach(function(item){DB.defeitosCI.push({id:genId(),cat:cat.cat,nome:item,ativo:true});});});
    saveDB();
  }
}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function diasDesde(iso){var d=new Date(iso+'T00:00:00'),h=new Date();h.setHours(0,0,0,0);return Math.max(0,Math.floor((h-d)/86400000));}
function fmtVal(v){return'R$ '+Number(v).toFixed(2).replace('.',',');}
function fmtData(iso){if(!iso)return'—';return new Date(iso+'T12:00:00').toLocaleDateString('pt-BR');}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];}
function todayISO(){return new Date().toISOString().split('T')[0];}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getStatusInfo(d){
  if(d<=15)return{cls:'status-verde',txt:'Dentro do prazo inicial',cardCls:'green-card'};
  if(d<=35)return{cls:'status-amarelo',txt:'Em análise / atenção',cardCls:'yellow-card'};
  if(d<=40)return{cls:'status-vermelho',txt:'Próximo do atraso',cardCls:'red-card'};
  return{cls:'status-critico',txt:'CRÍTICO — Mais de 40 dias',cardCls:'orange-card'};
}
function dc(d){return d>40?'var(--orange)':d>35?'var(--red)':d>15?'var(--yellow)':'var(--green)';}
function getAtivos(cId){return DB.robos.filter(function(r){return r.clienteId===cId&&r.status==='reparo';});}
function getGar(cId){return DB.robos.filter(function(r){return r.clienteId===cId&&r.status==='garantia';});}
function getAtras(cId){return DB.robos.filter(function(r){return r.clienteId===cId&&r.status==='reparo'&&diasDesde(r.dataEntrada)>40;});}
function getMaior(cId){var a=getAtivos(cId);return a.length?Math.max.apply(null,a.map(function(r){return diasDesde(r.dataEntrada);})):0;}
function getCats(){var c=[];DB.catalogo.forEach(function(x){if(c.indexOf(x.cat)===-1)c.push(x.cat);});return c.sort();}
function switchTab(tab){
  document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  var pane=document.getElementById('tab-'+tab);
  if(pane)pane.classList.add('active');
  // Encontra o botão pelo onclick em vez de por índice
  document.querySelectorAll('.tab-btn').forEach(function(b){
    if(b.getAttribute('onclick')&&b.getAttribute('onclick').indexOf("'"+tab+"'")!==-1){
      b.classList.add('active');
    }
  });
  currentTab=tab;renderTab(tab);
}
function renderTab(tab){
  if(tab==='clientes')renderClientes();
  else if(tab==='checkin')renderCheckin();
  else if(tab==='fila')renderFila();
  else if(tab==='alertas')renderAlertas();
  else if(tab==='garantia')renderGarantia();
  else if(tab==='lixeira')renderLixeira();
  else if(tab==='etiqueta')renderEtiqueta();
  else if(tab==='diagnostico')renderDiagnosticoLista();
  else if(tab==='relatorio')renderRelatorio();
}

function updateAlertBanner(){
  // Atrasados que ainda NÃO foram para bancada
  var atrasados=DB.robos.filter(function(r){
    return r.status==='reparo'&&diasDesde(r.dataEntrada)>40&&!r.bancada&&!r.entradaBancada;
  });
  var lembretes=DB.lembretes?DB.lembretes.filter(function(l){return !l.feito&&new Date(l.dt)<=new Date();}):[];
  var el=document.getElementById('alert-banner');
  var ticker=document.getElementById('alert-ticker');
  if(!atrasados.length&&!lembretes.length){el.style.display='none';return;}
  var parts=[];
  lembretes.forEach(function(l){
    var r=DB.robos.find(function(x){return x.id===l.roboId;});
    var c=r?DB.clientes.find(function(x){return x.id===r.clienteId;}):null;
    parts.push('<span style="color:#ffd600;">🔔 '+l.label+(c?' · '+c.nome:'')+'</span>');
  });
  atrasados.forEach(function(r){
    var c=DB.clientes.find(function(x){return x.id===r.clienteId;});
    var num='#'+String(r.numVisual).padStart(3,'0');
    var dias=diasDesde(r.dataEntrada);
    parts.push('<span style="color:#ffd600;">⚠️ '+num+(c?' · '+c.nome:'')+(r.modelo?' · '+r.modelo:'')+' — '+dias+' dias</span>');
  });
  if(ticker)ticker.innerHTML='&nbsp;&nbsp;&nbsp;'+parts.join('&nbsp;&nbsp;&nbsp;•&nbsp;&nbsp;&nbsp;')+'&nbsp;&nbsp;&nbsp;';
  el.style.display='flex';
}
function renderBadges(){
  var al=DB.robos.filter(function(r){return r.status==='reparo'&&diasDesde(r.dataEntrada)>35;});
  var b=document.getElementById('badge-alertas');
  if(al.length){b.textContent=al.length;b.style.display='inline-block';b.className='tab-badge'+(al.some(function(r){return diasDesde(r.dataEntrada)>40;})?' orange':'');}
  else b.style.display='none';
  var bl=document.getElementById('badge-lixeira');
  if(DB.lixeira.length){bl.textContent=DB.lixeira.length;bl.style.display='inline-block';}else bl.style.display='none';

}

function gerarPixPayload(chave,valor,nome,cidade){
  function f(id,v){var s=String(v);return id+String(s.length).padStart(2,'0')+s;}
  var merchant=f('00','BR.GOV.BCB.PIX')+f('01',chave);
  var p=f('00','01')+f('26',merchant)+f('52','0000')+f('53','986')+f('54',parseFloat(valor).toFixed(2))+f('58','BR')+f('59',nome.slice(0,25))+f('60',cidade.slice(0,15))+f('62',f('05','***'));
  function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?(c<<1)^0x1021:(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,'0');}
  var full=p+'6304';return full+crc16(full);
}
function gerarPixQrUrl(valor){
  var payload=gerarPixPayload('moledoeletrotech@gmail.com',valor,'MoLeDo ElEtRoTeCh','Umuarama');
  return'https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=4&data='+encodeURIComponent(payload);
}

      status:'cancelado',

      import('https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js').then(function(fa){
        var apps=fa.getApps?fa.getApps():[];

function voltarEtapa(roboId){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var etapaAtual=r.status==='garantia'?3:(r.diagnostico?2:(r.bancada?1:0));
  if(etapaAtual===0)return;
  // Verifica se etapa atual teve WA enviado
  var tiposWA={1:'bancada',2:'diagnostico',3:'servicoPronto'};
  var tipoWA=tiposWA[etapaAtual];
  var waEnviado=tipoWA&&r.mensagens&&r.mensagens.find(function(m){return m.tipo===tipoWA;});
  if(waEnviado){
    var etapaLabel={1:'Bancada',2:'Diagnóstico',3:'Serviço Pronto'}[etapaAtual];
    openModal('<div class="modal-title">⚠️ Atenção</div>'+
      '<div style="font-size:13px;color:var(--text2);margin-bottom:16px;">A etapa <strong style="color:#ffd600;">'+etapaLabel+'</strong> já teve uma mensagem enviada via WhatsApp para o cliente.<br><br>Deseja voltar mesmo assim?</div>'+
      '<div class="modal-actions">'+
      '<button class="btn btn-close" onclick="closeModal()">❌ Não voltar</button>'+
      '<button class="btn btn-primary" onclick="confirmarVoltarEtapa(\''+roboId+'\')">✅ Sim, voltar</button>'+
      '</div>');
  } else {
    confirmarVoltarEtapa(roboId);
  }
}

function confirmarVoltarEtapa(roboId){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var etapaAtual=r.status==='garantia'?3:(r.diagnostico?2:(r.bancada?1:0));
  // Voltar de garantia → reparo
  if(etapaAtual===3){
    r.status='reparo';r.dataEntrega=null;r.garantiaAte=null;r.servicoPronto=false;
    saveDB();closeModal();renderAll();showToast('⬅️ Voltou para Diagnóstico');
    return;
  }
  // Voltar de diagnóstico → bancada (NÃO apaga diagnóstico ainda)
  if(etapaAtual===2){
    // Apenas marca que etapa atual é bancada — diagnóstico fica intacto até salvar bancada
    r._etapaAtual='bancada';
    saveDB();closeModal();renderAll();
    // Abre bancada automaticamente
    setTimeout(function(){closeModal();abrirBancada(roboId);},200);
    showToast('⬅️ Voltou para Bancada');
    return;
  }
  // Voltar de bancada → checkin (apaga bancada)
  if(etapaAtual===1){
    r.bancada=null;r.entradaBancada=null;r._etapaAtual='checkin';
    saveDB();closeModal();renderAll();showToast('⬅️ Voltou para Check-in');
    return;
  }
}

function avancarEtapa(roboId){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var etapaAtual=r.status==='garantia'?3:(r.diagnostico?2:(r.bancada?1:0));
  if(etapaAtual===1&&r.diagnostico){
    // Avança de bancada para diagnóstico
    r._etapaAtual='diagnostico';
    saveDB();closeModal();renderAll();
    setTimeout(function(){closeModal();abrirDiagnostico(roboId);},200);
    showToast('➡️ Avançou para Diagnóstico');
  } else if(etapaAtual===2&&r.servicoPronto){
    showToast('➡️ Já está em Serviço Pronto');
  }
}

function republicarFichaPublica(roboId){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var c=DB.clientes.find(function(x){return x.id===r.clienteId;});
  showToast('🔄 Publicando ficha...');
  try{
    import('https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js').then(function(fs){
      import('https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js').then(function(fa){
        var apps=fa.getApps?fa.getApps():[];
        if(!apps.length){showToast('⚠️ Firebase não conectado.');return;}
        var db2=fs.getFirestore(apps[0]);
        var dadosPub={
          numOS:r.numOS||('#'+String(r.numVisual).padStart(3,'0')),
          modelo:r.modelo||'',
          voltagem:r.voltagem||'',
          dataEntrada:r.dataEntrada||'',
          dataEntrega:r.dataEntrega||'',
          garantiaAte:r.garantiaAte||'',
          itens:r.bancada&&r.bancada.itens?r.bancada.itens:{},
          whatsapp:c?c.whatsapp:'',
          updatedAt:Date.now()
        };
        fs.setDoc(fs.doc(db2,'publico',roboId),dadosPub)
          .then(function(){showToast('✅ Ficha publicada! QR já funciona.');})
          .catch(function(e){showToast('⚠️ Erro ao publicar: '+e.message);});
      });
    });
  }catch(e){showToast('⚠️ Erro: '+e.message);}
}

function executarEntrega(roboId,entregue,pago){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var c=DB.clientes.find(function(x){return x.id===r.clienteId;});
  var hoje=todayISO();
  r.status='garantia';
  r.dataEntrada=r.dataEntrada||hoje;
  r.garantiaAte=addDays(hoje,90);
  r.pago=pago===true;
  r.entregue=entregue===true;
  r.dataEntrega=entregue?hoje:null;
  // Remove alertas anteriores deste robô (evita duplicatas)
  if(!DB.lembretes)DB.lembretes=[];
  DB.lembretes=DB.lembretes.filter(function(l){return l.roboId!==roboId||l.tipo==='manual';});
  var num='#'+String(r.numVisual).padStart(3,'0');
  var nomeCliente=c?c.nome:'Cliente';
  // Cria alertas conforme situação
  if(entregue&&!pago){
    // Entregue s/pagar → alerta de cobrança
    DB.lembretes.push({id:genId(),roboId:roboId,tipo:'cobranca',label:'💰 Cobrar '+nomeCliente+' '+num+' (entregue s/pagar)',dt:hoje+'T09:00',feito:false});
  }
  if(!entregue&&pago){
    // Pago s/entregar → alerta de entrega pendente
    DB.lembretes.push({id:genId(),roboId:roboId,tipo:'entrega',label:'📦 Entregar robô '+num+' para '+nomeCliente+' (já pagou)',dt:hoje+'T09:00',feito:false});
  }
  if(!entregue&&!pago){
    // Nem entregue nem pago → alerta dos dois
    DB.lembretes.push({id:genId(),roboId:roboId,tipo:'cobranca',label:'💰 Cobrar e entregar '+num+' · '+nomeCliente,dt:hoje+'T09:00',feito:false});
  }
  saveDB();closeModal();if(fichaClienteId)refreshFichaContent();renderAll();switchTab('garantia');
  var msg=entregue&&pago?'✅💰 Entregue e pago! Garantia ativada.':
         entregue&&!pago?'📦 Entregue! Alerta de cobrança criado.':
         !entregue&&pago?'💰 Pago! Alerta de entrega criado.':
         '⏳ Registrado! Alertas de cobrança e entrega criados.';
  showToast(msg);
  // Salva dados públicos no Firebase
  try{
    import('https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js').then(function(fs){
      import('https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js').then(function(fa){
        var apps=fa.getApps?fa.getApps():[];
        if(!apps.length)return;
        var db2=fs.getFirestore(apps[0]);
        var dadosPub={
          numOS:r.numOS||('#'+String(r.numVisual).padStart(3,'0')),
          modelo:r.modelo||'',
          voltagem:r.voltagem||'',
          dataEntrada:r.dataEntrada||'',
          dataEntrega:hoje,
          garantiaAte:r.garantiaAte,
          itens:r.bancada&&r.bancada.itens?r.bancada.itens:{},
          whatsapp:c?c.whatsapp:'',
          updatedAt:Date.now()
        };
        fs.setDoc(fs.doc(db2,'publico',roboId),dadosPub).catch(function(e){console.log('pub err',e);});
      });
    });
  }catch(e){console.log('import err',e);}
}
function gerarMsgDiag(r,c){
  var d=r.diagnostico;if(!d)return'';
  var num='#'+String(r.numVisual).padStart(3,'0');
  var L='════════════════════════════';var l='────────────────────────────';
  var nomeNoMsg=(c?c.nome:'?');
  if(c&&c.tipo==='vc'&&r.nomeClienteFinal)nomeNoMsg='Vendedor: '+c.nome+'\nCliente: '+r.nomeClienteFinal;
  else if(c&&c.tipo==='vd')nomeNoMsg='Vendedor: '+c.nome;
  var msg=L+'\n     🔧 DIAGNÓSTICO TÉCNICO\n'+L+'\nRobô: '+num+' — '+r.modelo+'\n'+(c&&(c.tipo==='vc')? nomeNoMsg : 'Cliente: '+nomeNoMsg)+'\nData: '+fmtData(d.data)+'\n';
  if(d.descricao)msg+=l+'\n'+d.descricao+'\n';
  if(d.itens&&d.itens.length){
    msg+=L+'\n         📋 SERVIÇOS\n'+L+'\n';
    d.itens.forEach(function(it){
      var n=it.nome.length>18?it.nome.substring(0,18)+'..':it.nome;
      var v=fmtVal(it.preco);var p='';var tot=28-n.length-v.length;
      for(var i=0;i<Math.max(1,tot);i++)p+='.';
      msg+=n+p+v+'\n';
    });
    if(d.desconto>0)msg+=l+'\nDesconto............-'+fmtVal(d.desconto)+'\n';
    msg+=L+'\nTOTAL...............'+fmtVal(d.total)+'\n'+L+'\n';
    msg+='💰 À vista (PIX/dinheiro): *'+fmtVal(d.avista)+'*\n';
    if(waParcela===0)msg+='💳 Cartão: sob consulta (até 8x)\n';
    else if(waParcela===-1)msg+='💳 Débito: *'+fmtVal(d.total*(1+TAXAS.debito))+'*\n';
    else if(waParcela===1)msg+='💳 Crédito à vista: *'+fmtVal(d.total*(1+TAXAS.c1))+'*\n';
    else{var tx=TAXAS['c'+waParcela]||0;var vC=d.total*(1+tx);msg+='💳 Cartão '+waParcela+'x: *'+fmtVal(vC)+'* ('+waParcela+'x de *'+fmtVal(vC/waParcela)+'*)\n';}
  }
  msg+=L+'\n           🛡️ GARANTIA\n'+L+'\n90 dias sobre o serviço realizado\n'+l+'\nMoLeDo ElEtRoTeCh\nAssistência Técnica · Robôs Aspiradores';
  return msg;
}

function processarIADiag(){
  var input=document.getElementById('ia-diag-input').value.trim();
  if(!input){alert('Descreva o problema antes.');return;}
  var btn=document.querySelector('#modal-box .btn-primary');
  btn.textContent='⏳ Processando...';btn.disabled=true;
  var catalogoAtivo=DB.catalogo.filter(function(x){return x.ativo!==false;});
  var catalogoJson=JSON.stringify(catalogoAtivo.map(function(x){return{id:x.id,nome:x.nome,cat:x.cat,valor:x.valor||0};}));
  var sysPrompt='Você é um assistente técnico especializado em robôs aspiradores da MoLeDo ElEtRoTeCh. '
  +'O técnico vai descrever o que encontrou. Você deve retornar APENAS um JSON válido, sem markdown, sem backticks, sem texto antes ou depois. '
  +'Formato exato: {"descricao":"diagnóstico técnico detalhado e profissional do problema encontrado",'
  +'"acaoNecessaria":"descrição clara do que será feito para resolver",'
  +'"observacao":"observações adicionais importantes para o cliente",'
  +'"itens":[{"catalogoId":"id_ou_null","nome":"nome do serviço/peça","preco":valor_numerico}]}. '
  +'Use linguagem técnica mas clara. Seja detalhado na descricao explicando a causa do problema. '
  +'Use os itens do catálogo quando possível (use o catalogoId correto). '
  +'Crie novos itens quando necessário (catalogoId null). '
  +'Se o técnico mencionar siglas como CI, FB, SMD, pesquise o significado e explique. '
  +'O preço de cada item deve ser o valor mencionado dividido proporcionalmente. '
  +'Catálogo disponível: '+catalogoJson;
  fetch('https://moledo-ia.moledoeletrotech.workers.dev/',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      system:sysPrompt,
      input:input
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    var text=data.text||'';
    try{
      if(!text){throw new Error('Resposta vazia');}
      // Remove markdown code blocks e extrai só o JSON
      var clean=text.replace(/```json/gi,'').replace(/```/g,'').trim();
      // Tenta encontrar o JSON mesmo que tenha texto antes/depois
      var jsonMatch=clean.match(/\{[\s\S]*\}/);
      if(!jsonMatch)throw new Error('JSON não encontrado');
      var res=JSON.parse(jsonMatch[0]);
      if(!res.descricao&&!res.itens)throw new Error('Formato inválido');
      var resDiv=document.getElementById('ia-diag-result');
      resDiv.style.display='block';
      var html='<div style="background:rgba(138,43,226,.1);border:1px solid rgba(138,43,226,.35);border-radius:10px;padding:12px;">';
      html+='<div style="font-size:11px;font-weight:700;color:#c77dff;margin-bottom:6px;">✨ RESULTADO DA IA</div>';
      html+='<div style="font-size:12px;font-weight:700;color:var(--cyan3);margin-bottom:2px;">DIAGNÓSTICO</div>';
      html+='<div style="font-size:13px;color:var(--text);margin-bottom:8px;">'+esc(res.descricao||'')+'</div>';
      if(res.acaoNecessaria)html+='<div style="font-size:12px;font-weight:700;color:var(--cyan3);margin-bottom:2px;">AÇÃO NECESSÁRIA</div><div style="font-size:13px;color:var(--text);margin-bottom:8px;">'+esc(res.acaoNecessaria)+'</div>';
      if(res.observacao)html+='<div style="font-size:12px;font-weight:700;color:var(--cyan3);margin-bottom:2px;">OBSERVAÇÃO</div><div style="font-size:13px;color:var(--text);margin-bottom:8px;">'+esc(res.observacao)+'</div>';
      if(res.itens&&res.itens.length){
        html+='<div style="font-size:11px;font-weight:700;color:var(--cyan3);margin-bottom:4px;">ITENS SUGERIDOS</div>';
        res.itens.forEach(function(it,i){
          html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);">'+
            '<span style="font-size:13px;color:var(--text);">'+esc(it.nome)+'</span>'+
            '<span style="font-size:13px;font-weight:700;color:var(--cyan);">R$ '+Number(it.preco||0).toFixed(2).replace('.',',')+'</span>'+
          '</div>';
        });
      }
      html+='<button type="button" onclick="aplicarIADiag('+JSON.stringify(JSON.stringify(res))+')" style="width:100%;margin-top:10px;padding:10px;background:rgba(0,200,150,.2);border:1px solid rgba(0,200,150,.5);border-radius:8px;color:#00c896;font-family:\'Rajdhani\',sans-serif;font-size:14px;font-weight:700;cursor:pointer;">✅ Aplicar no Diagnóstico</button>';
      html+='</div>';
      resDiv.innerHTML=html;
      btn.textContent='✨ Gerar novamente';btn.disabled=false;
    }catch(e){
      // Mostra o texto bruto para debug
      var resDiv=document.getElementById('ia-diag-result');
      if(resDiv&&text){
        resDiv.style.display='block';
        resDiv.innerHTML='<div style="background:rgba(255,100,0,.1);border:1px solid rgba(255,100,0,.3);border-radius:8px;padding:10px;font-size:11px;color:#ff6b35;">⚠️ Erro ao processar. Resposta da IA:<br><pre style="white-space:pre-wrap;font-size:10px;margin-top:6px;">'+esc(text.substring(0,500))+'</pre></div>';
      }else{
        alert('Erro ao interpretar resposta da IA. Tente novamente.');
      }
      btn.textContent='✨ Gerar novamente';btn.disabled=false;
    }
  })
  .catch(function(){alert('Erro de conexão. Verifique a internet.');btn.textContent='✨ Gerar';btn.disabled=false;});
}
function aplicarIADiag(jsonStr){
  try{
    var res=JSON.parse(jsonStr);
    // Fecha o modal PRIMEIRO para que os elementos do diagnóstico fiquem acessíveis
    closeModal();
    // Pequeno delay para o modal fechar antes de preencher
    setTimeout(function(){
      // Preenche descrição
      var descEl=document.getElementById('diag-descricao');
      if(descEl&&res.descricao){
        var fullDesc=res.descricao;
        if(res.acaoNecessaria)fullDesc+='\n\nAÇÃO NECESSÁRIA:\n'+res.acaoNecessaria;
        if(res.observacao)fullDesc+='\n\nOBSERVAÇÃO:\n'+res.observacao;
        descEl.value=fullDesc;
      }
      // Adiciona/seleciona itens no catálogo
      if(res.itens&&res.itens.length){
        // Itens avulsos: acumula nome e valor separados por vírgula
        var avulsoNomes=[];var avulsoTotal=0;
        res.itens.forEach(function(it){
          if(it.catalogoId){
            var chk=document.getElementById('dchk-'+it.catalogoId);
            var preco=document.getElementById('dpreco-'+it.catalogoId);
            if(chk&&!chk.checked){chk.checked=true;toggleDiagItem(it.catalogoId);}
            if(preco&&it.preco){preco.value=Number(it.preco).toFixed(2);}
          } else {
            avulsoNomes.push(it.nome);
            avulsoTotal+=Number(it.preco)||0;
          }
        });
        // Preenche campo avulso se houver itens sem catálogo
        if(avulsoTotal>0){
          var avulsoEl=document.getElementById('diag-avulso');
          var avulsoDescEl=document.getElementById('diag-avulso-desc');
          if(avulsoEl){
            var cur=parseFloat(avulsoEl.value)||0;
            avulsoEl.value=(cur+avulsoTotal).toFixed(2);
          }
          if(avulsoDescEl&&avulsoNomes.length){
            var curDesc=avulsoDescEl.value?avulsoDescEl.value+', ':'';
            avulsoDescEl.value=curDesc+avulsoNomes.join(', ');
          }
        }
        atualizarTotalDiag();
      }
      showToast('✅ IA preencheu o diagnóstico!');
    },150);
  }catch(e){alert('Erro ao aplicar. Tente novamente.');}
}

function atualizarTotalDiag(){
  var el=document.getElementById('diag-content');if(!el)return;
  var abertura=parseFloat(el.dataset.abertura||200);
  var subtotal=abertura;
  DB.catalogo.forEach(function(cat){
    var chk=document.getElementById('dchk-'+cat.id);var preco=document.getElementById('dpreco-'+cat.id);
    if(chk&&chk.checked&&preco)subtotal+=parseFloat(preco.value)||0;
  });
  var desconto=parseFloat((document.getElementById('diag-desconto')||{}).value)||0;
  var frete=parseFloat((document.getElementById('diag-frete')||{}).value)||0;
  var avulso=parseFloat((document.getElementById('diag-avulso')||{}).value)||0;
  var avulsoDesc=(document.getElementById('diag-avulso-desc')||{}).value||'';
  var total=Math.max(0,subtotal-desconto+frete+avulso);
  el.dataset.total=total;el.dataset.avista=total;el.dataset.desconto=desconto;el.dataset.frete=frete;el.dataset.avulso=avulso;el.dataset.avulsoDesc=avulsoDesc;
  var box=document.getElementById('diag-total-box');
  if(box){
    box.innerHTML='<div class="diag-total-linha"><span>Abertura/Diagnóstico</span><span>'+fmtVal(abertura)+'</span></div>'+
      (desconto>0?'<div class="diag-total-linha desconto"><span>Desconto</span><span>-'+fmtVal(desconto)+'</span></div>':'')+
      (frete>0?'<div class="diag-total-linha"><span>🚚 Frete</span><span>'+fmtVal(frete)+'</span></div>':'')+
      (avulso>0?'<div class="diag-total-linha"><span>➕ '+(avulsoDesc||'Cobrança avulsa')+'</span><span>'+fmtVal(avulso)+'</span></div>':'')+
      '<div class="diag-total-linha total"><span>TOTAL</span><span>'+fmtVal(total)+'</span></div>'+
      '<div class="diag-total-linha avista"><span>💰 À vista (PIX)</span><span>'+fmtVal(total)+'</span></div>'+
      '<div class="diag-total-linha"><span style="color:var(--text3)">💳 Cartão</span><span style="color:var(--text3)">sob consulta (até 8x)</span></div>';
  }
  var calc=document.getElementById('diag-calc-box');
  if(calc&&total>0){
    var vD=total*(1+TAXAS.debito);var vCV=total*(1+TAXAS.c1);
    var tx=TAXAS['c'+parcelaSel]||TAXAS.c2;var vC=total*(1+tx);var vP=vC/parcelaSel;
    var btns=[2,3,4,5,6,7,8].map(function(n){return'<button type="button" class="parcela-btn'+(n===parcelaSel?' sel':'')+'" onclick="selParcela('+n+')">'+n+'x</button>';}).join('');
    calc.innerHTML='<div class="calc-title">CALCULADORA INTERNA — não vai na mensagem</div>'+
      '<div class="calc-row"><span class="calc-label">💳 Débito</span><span class="calc-val">'+fmtVal(vD)+'</span></div>'+
      '<div class="calc-row"><span class="calc-label">💳 Crédito à vista</span><span class="calc-val">'+fmtVal(vCV)+'</span></div>'+
      '<div style="margin:8px 0 4px;font-size:12px;color:var(--text2);font-weight:700;">💳 Crédito parcelado:</div>'+
      '<div class="parcela-btns">'+btns+'</div>'+
      '<div class="calc-row"><span class="calc-label">'+parcelaSel+'x</span><span class="calc-val">'+fmtVal(vC)+' ('+parcelaSel+'x de '+fmtVal(vP)+')</span></div>';
  } else if(calc)calc.innerHTML='<div style="font-size:12px;color:var(--text3);text-align:center;padding:8px;">Adicione itens para ver os valores</div>';
}

  var inp=document.getElementById('ci-data');if(!inp.value)inp.value=todayISO();

function changeQty(d){
  var novaQty=Math.max(1,Math.min(10,ciQty+d));
  if(novaQty===ciQty)return;
  if(novaQty>ciQty){
    // adicionando — salva dados atuais e adiciona só o novo bloco
    salvarDadosBlocos();
    ciQty=novaQty;
    document.getElementById('ci-qty-val').textContent=ciQty;
    if(!ciDefects[ciQty])ciDefects[ciQty]=[];
    document.getElementById('ci-robots-container').insertAdjacentHTML('beforeend',buildRoboBlock(ciQty));
    restaurarDadosBlocos();
  } else {
    // diminuindo — salva dados, remove só o último bloco
    salvarDadosBlocos();
    var c=document.getElementById('ci-robots-container');
    var blocos=c.querySelectorAll('.robot-block');
    if(blocos.length>0)blocos[blocos.length-1].remove();
    delete ciDefects[ciQty];
    ciQty=novaQty;
    document.getElementById('ci-qty-val').textContent=ciQty;
    restaurarDadosBlocos();
  }
}
function salvarDadosBlocos(){
  for(var i=1;i<=ciQty;i++){
    var sn=document.getElementById('ci-sn-'+i);
    var modelo=document.getElementById('ci-modelo-'+i);
    var obs=document.getElementById('ci-obs-'+i);
    var nosn=document.getElementById('ci-nosn-'+i);
    if(!window._ciCache)window._ciCache={};
    window._ciCache[i]={
      sn:sn?sn.value:'',
      modelo:modelo?modelo.value:'',
      obs:obs?obs.value:'',
      nosn:nosn?nosn.checked:false,
      volt:document.getElementById('vb-ci'+i)?document.getElementById('vb-ci'+i).dataset.volt||'—':'—'
    };
  }
}
function restaurarDadosBlocos(){
  if(!window._ciCache)return;
  for(var i=1;i<=ciQty;i++){
    if(!window._ciCache[i])continue;
    var d=window._ciCache[i];
    var sn=document.getElementById('ci-sn-'+i);
    var modelo=document.getElementById('ci-modelo-'+i);
    var obs=document.getElementById('ci-obs-'+i);
    var nosn=document.getElementById('ci-nosn-'+i);
    if(sn)sn.value=d.sn;
    if(modelo)modelo.value=d.modelo;
    if(obs)obs.value=d.obs;
    if(nosn){nosn.checked=d.nosn;if(d.nosn&&sn){sn.value='';sn.disabled=true;}}
    if(d.volt&&d.volt!=='—'){
      var vb=document.getElementById('vb-ci'+i);
      if(vb){vb.dataset.volt=d.volt;vb.querySelectorAll('.volt-btn').forEach(function(b){if(b.textContent.indexOf(d.volt)!==-1)b.classList.add('sel');else b.classList.remove('sel');});}
    }
    // restaurar defeitos
    if(ciDefects[i]&&ciDefects[i].length){
      var btns=document.querySelectorAll('#ci-robots-container .robot-block:nth-child('+i+') .defect-btn');
      btns.forEach(function(b){if(ciDefects[i].indexOf(b.textContent.trim())!==-1)b.classList.add('sel');});
    }
  }
}
function generateRobotBlocks(){
  var c=document.getElementById('ci-robots-container');c.innerHTML='';
  for(var i=1;i<=ciQty;i++){if(!ciDefects[i])ciDefects[i]=[];c.insertAdjacentHTML('beforeend',buildRoboBlock(i));}

function salvarCheckin(){
  var nome=document.getElementById('ci-nome').value.trim();var wa=document.getElementById('ci-wa').value.trim();var data=document.getElementById('ci-data').value;
  if(!nome){alert('Informe o nome.');return;}if(!wa){alert('Informe o WhatsApp.');return;}if(!data){alert('Informe a data.');return;}
  var nomeCF=ciTipo==='vc'?(document.getElementById('ci-nome-cf').value.trim()||''):'';

  }
  var cliente=null;
  for(var j=0;j<DB.clientes.length;j++){if(DB.clientes[j].whatsapp===wa){cliente=DB.clientes[j];break;}}

  var nextNum=ativos.length?Math.max.apply(null,ativos.map(function(r){return r.numVisual;}))+1:1;
  for(var k=1;k<=ciQty;k++){

      voltagem:getVolt('ci'+k),defeitos:[].concat(ciDefects[k]||[]),
      obs:document.getElementById('ci-obs-'+k).value.trim(),
      dataEntrada:data,status:'reparo',dataEntrega:null,garantiaAte:null,mensagens:[],diagnostico:null,nomeClienteFinal:nomeCF});
  }
  saveDB();
  document.getElementById('ci-nome').value='';document.getElementById('ci-wa').value='';document.getElementById('ci-data').value='';

  ciQty=1;ciDefects={};ciTipo='cf';document.getElementById('ci-qty-val').textContent=1;

function autocompleteModelo(input,n){
  var val=input.value.trim();
  var box=document.getElementById('ci-modelo-ac-'+n);
  if(!val||val.length<2){if(box)box.style.display='none';return;}
  var lista=(DB.modelosCustom||[]).concat(MODELOS_PAD);
  var matches=lista.filter(function(m){return m.toLowerCase().indexOf(val.toLowerCase())!==-1;});
  if(!matches.length){if(box)box.style.display='none';return;}
  box.innerHTML=matches.slice(0,6).map(function(m){
    return'<div onclick="selecionarModelo(\''+n+'\',\''+m.replace(/'/g,"\\'")+'\')" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);font-family:\'Rajdhani\',sans-serif;font-weight:600;">'+esc(m)+'</div>';
  }).join('');
  box.style.display='block';
}
function selecionarModelo(n,modelo){
  var inp=document.getElementById('ci-modelo-'+n);
  var box=document.getElementById('ci-modelo-ac-'+n);

  if(box)box.style.display='none';
}

}

var buscaAberta=false;
function toggleBusca(){
  buscaAberta=!buscaAberta;
  var el=document.getElementById('busca-overlay');
  if(el){el.style.display=buscaAberta?'flex':'none';if(buscaAberta)document.getElementById('busca-input').focus();}
}
var _buscaTimer=null;
function executarBusca(val){
  clearTimeout(_buscaTimer);
  var res=document.getElementById('busca-resultados');if(!res)return;
  if(!val||val.length<2){res.innerHTML='<div style="padding:16px;text-align:center;color:var(--text3);font-size:13px;">Digite ao menos 2 letras...</div>';return;}
  _buscaTimer=setTimeout(function(){_executarBuscaAgora(val);},200);
}
function _executarBuscaAgora(val){
  var res=document.getElementById('busca-resultados');if(!res)return;
  var q=val.toLowerCase().replace(/\D/g,'');// versão só números pra busca por fone
  var qStr=val.toLowerCase();
  var html='';
  // Clientes
  DB.clientes.forEach(function(c){
    var nomeMatch=c.nome.toLowerCase().indexOf(qStr)!==-1;
    var foneMatch=q.length>=4&&c.whatsapp.replace(/\D/g,'').indexOf(q)!==-1;
    if(nomeMatch||foneMatch){
      var robosCliente=DB.robos.filter(function(r){return r.clienteId===c.id&&r.status==='reparo';});
      html+='<div onclick="toggleBusca();openClienteDetalhe(\''+c.id+'\')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;active:background:var(--bg2);">'+
        '<span style="font-size:18px;">👤</span>'+
        '<div style="flex:1;">'+
          '<div style="font-size:14px;font-weight:700;color:var(--text);">'+esc(c.nome)+'</div>'+
          '<div style="font-size:12px;color:var(--text3);">📱 '+esc(c.whatsapp)+(robosCliente.length?' · 🤖 '+robosCliente.length+' em reparo':'')+'</div>'+
        '</div>'+
        '<span style="font-size:11px;color:var(--cyan2);font-weight:700;">'+(foneMatch&&!nomeMatch?'📱':'')+'</span>'+
      '</div>';
    }
  });
  // Robôs por modelo/SN/número
  DB.robos.forEach(function(r){
    var c=DB.clientes.find(function(x){return x.id===r.clienteId;});
    var num='#'+String(r.numVisual).padStart(3,'0');
    var numOS=r.numOS||'';
    if((r.modelo&&r.modelo.toLowerCase().indexOf(qStr)!==-1)||(r.sn&&r.sn.toLowerCase().indexOf(qStr)!==-1)||num.indexOf(qStr)!==-1||numOS.toLowerCase().indexOf(qStr)!==-1){
      var statusCor=r.status==='garantia'?'#ce93d8':r.status==='reparo'?'var(--cyan)':'var(--text3)';
      html+='<div onclick="toggleBusca();openFichaRobo(\''+r.id+'\')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;">'+
        '<span style="font-size:18px;">🤖</span>'+
        '<div style="flex:1;">'+
          '<div style="font-size:14px;font-weight:700;color:'+statusCor+';">'+num+' · '+esc(r.modelo||'—')+'</div>'+
          '<div style="font-size:12px;color:var(--text3);">'+(c?esc(c.nome):'')+' · '+esc(r.sn||'—')+(numOS?' · '+numOS:'')+'</div>'+
        '</div>'+
        '<span style="font-size:10px;color:var(--text3);">'+esc(r.status)+'</span>'+
      '</div>';
    }
  });
  res.innerHTML=html||'<div style="padding:16px;text-align:center;color:var(--text3);font-size:13px;">Nenhum resultado para "<b>'+esc(val)+'</b>"</div>';
}

var LEMBRETE_TIPOS=[
  {id:'ligar',label:'📞 Ligar pro cliente'},
  {id:'pronto',label:'💬 Avisar que está pronto'},
  {id:'diagnostico',label:'💊 Fazer diagnóstico'},
  {id:'orcamento',label:'📋 Retornar orçamento'},
  {id:'semresposta',label:'📱 Cliente não respondeu'},
  {id:'outro',label:'✏️ Outro'}
];

function abrirLembrete(roboId){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var c=DB.clientes.find(function(x){return x.id===r.clienteId;});
  var num='#'+String(r.numVisual).padStart(3,'0');
  var hoje=new Date();
  var defaultDt=new Date(hoje.getTime()+8*60*60*1000);
  var dtStr=defaultDt.toISOString().slice(0,16);
  var tiposBtns=LEMBRETE_TIPOS.map(function(t){
    return'<button type="button" onclick="selLembreteTipo(\''+t.id+'\')" id="lt-'+t.id+'" class="defect-btn" style="font-size:12px;padding:7px 10px;">'+t.label+'</button>';
  }).join('');
  openModal(
    '<div class="modal-title">🔔 Novo Lembrete</div>'+
    '<div style="font-size:13px;color:var(--cyan);font-weight:700;margin-bottom:10px;">'+num+' · '+(c?esc(c.nome):'—')+'</div>'+
    '<div class="form-group"><label class="form-label">Tipo</label>'+
    '<div class="defect-grid" style="gap:6px;">'+tiposBtns+'</div></div>'+
    '<div class="form-group" id="lt-outro-row" style="display:none;"><label class="form-label">Descrição</label>'+
    '<input id="lt-outro-txt" class="form-input" type="text" placeholder="Ex: Verificar se cliente buscou..."></div>'+
    '<div class="form-group"><label class="form-label">📅 Data e hora</label>'+
    '<input id="lt-dt" class="form-input" type="datetime-local" value="'+dtStr+'"></div>'+
    '<div class="modal-actions">'+
    '<button class="btn btn-close" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-primary" onclick="salvarLembrete(\''+roboId+'\')">🔔 Salvar Lembrete</button>'+
    '</div>'
  );
  window._lembreTipoSel=null;
}

function selLembreteTipo(id){
  window._lembreTipoSel=id;
  LEMBRETE_TIPOS.forEach(function(t){
    var b=document.getElementById('lt-'+t.id);
    if(b)b.style.background=t.id===id?'rgba(255,214,0,.25)':'';
  });
  var outroRow=document.getElementById('lt-outro-row');
  if(outroRow)outroRow.style.display=id==='outro'?'block':'none';
}

function salvarLembrete(roboId){
  if(!window._lembreTipoSel){showToast('⚠️ Selecione o tipo!');return;}
  var dtEl=document.getElementById('lt-dt');
  if(!dtEl||!dtEl.value){showToast('⚠️ Defina a data!');return;}
  var tipo=window._lembreTipoSel;
  var label=LEMBRETE_TIPOS.find(function(t){return t.id===tipo;});
  var descOutro=tipo==='outro'?(document.getElementById('lt-outro-txt')?document.getElementById('lt-outro-txt').value.trim():''):'';
  var lembrete={
    id:genId(),
    roboId:roboId,
    tipo:tipo,
    label:label?label.label:'🔔 Lembrete',
    descOutro:descOutro,
    dt:dtEl.value,
    feito:false,
    criadoEm:todayISO()
  };
  if(!DB.lembretes)DB.lembretes=[];
  DB.lembretes.push(lembrete);
  saveDB();
  closeModal();
  showToast('🔔 Lembrete salvo!');
}

function verificarAgendamentos(){
  if(!DB.robos)return;
  var agora=new Date();
  var mudou=false;
  DB.robos.forEach(function(r){
    if(r.status!=='reparo'||!r.agendamento)return;
    // Formato: "YYYY-MM-DD HH:MM" ou "YYYY-MM-DD"
    var dt=new Date(r.agendamento.replace(' ','T')+(r.agendamento.length===10?'T23:59':''));
    if(dt<=agora){
      // Move para garantia automaticamente
      r.status='garantia';
      r.dataEntrega=r.agendamento.split(' ')[0]||todayISO();
      r.garantiaAte=addDays(r.dataEntrega,90);
      r.agendamento=null;
      if(!r.mensagens)r.mensagens=[];
      r.mensagens.push({data:todayISO(),tipo:'entregue',auto:true});
      mudou=true;
      showToast('✅ '+('#'+String(r.numVisual).padStart(3,'0'))+' movido para garantia automaticamente!');
      // Publica no Firebase
      if(typeof republicarFichaPublica==='function')republicarFichaPublica(r.id);
    }
  });
  if(mudou){saveDB();renderAll();}
}
function abrirListaLembretes(){
  if(!DB.lembretes||!DB.lembretes.length){showToast('Nenhum lembrete cadastrado.');return;}
  var agora=new Date();
  var todos=DB.lembretes.slice().sort(function(a,b){return new Date(a.dt)-new Date(b.dt);});
  var html='<div class="modal-title">🔔 Lembretes</div>';
  var vencidos=todos.filter(function(l){return !l.feito&&new Date(l.dt)<=agora;});
  var futuros=todos.filter(function(l){return !l.feito&&new Date(l.dt)>agora;});
  var feitos=todos.filter(function(l){return l.feito;});
  function renderLembrete(l,cor){
    var r=DB.robos.find(function(x){return x.id===l.roboId;});
    var c=r?DB.clientes.find(function(x){return x.id===r.clienteId;}):null;
    var num=r?('#'+String(r.numVisual).padStart(3,'0')):'';
    var dtFmt=new Date(l.dt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    return'<div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid '+(cor||'var(--border)')+';border-radius:8px;padding:8px 10px;margin-bottom:6px;opacity:'+(l.feito?'0.5':'1')+';">'+
      '<div style="flex:1;">'+
        '<div style="font-size:12px;font-weight:700;color:#fff;">'+l.label+(l.descOutro?' — '+esc(l.descOutro):'')+'</div>'+
        '<div style="font-size:11px;color:#aaa;">'+num+(c?' · '+esc(c.nome):'')+'</div>'+
        '<div style="font-size:10px;color:'+(cor||'var(--text3)')+';">⏰ '+dtFmt+'</div>'+
      '</div>'+
      (!l.feito?
        '<div style="display:flex;gap:4px;">'+
          (r?'<button onclick="fecharLembreteBanner();closeModal();openFichaRobo(\''+r.id+'\')" style="background:var(--cyan);color:#000;border:none;border-radius:6px;padding:4px 7px;font-size:10px;font-weight:700;cursor:pointer;">📋</button>':'')+ 
          '<button onclick="marcarLembreteFeitoId(\''+l.id+'\');abrirListaLembretes()" style="background:rgba(0,230,118,.2);border:1px solid rgba(0,230,118,.4);color:#00e676;border-radius:6px;padding:4px 7px;font-size:10px;font-weight:700;cursor:pointer;">✅</button>'+
          '<button onclick="excluirLembrete(\''+l.id+'\')" style="background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.3);color:#ff1744;border-radius:6px;padding:4px 7px;font-size:10px;cursor:pointer;">🗑️</button>'+
        '</div>':'')+'</div>';
  }
  if(vencidos.length){
    html+='<div style="font-size:11px;font-weight:700;color:#ffd600;letter-spacing:1px;margin:8px 0 6px;">⚠️ VENCIDOS ('+vencidos.length+')</div>';
    html+=vencidos.map(function(l){return renderLembrete(l,'rgba(255,214,0,.4)');}).join('');
  }
  if(futuros.length){
    html+='<div style="font-size:11px;font-weight:700;color:var(--cyan);letter-spacing:1px;margin:10px 0 6px;">📅 PRÓXIMOS ('+futuros.length+')</div>';
    html+=futuros.map(function(l){return renderLembrete(l,'rgba(0,229,255,.2)');}).join('');
  }
  if(feitos.length){
    html+='<div style="font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;margin:10px 0 6px;">✅ CONCLUÍDOS ('+feitos.length+')</div>';
    html+=feitos.map(function(l){return renderLembrete(l,null);}).join('');
  }
  html+='<div class="modal-actions"><button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="closeModal()">Fechar</button></div>';
  openModal(html);
}

function excluirLembrete(id){
  DB.lembretes=DB.lembretes.filter(function(x){return x.id!==id;});
  saveDB();abrirListaLembretes();atualizarBadgeLembrete();
}

function atualizarBadgeLembrete(){
  var btn=document.getElementById('btn-lembrete');if(!btn)return;
  var agora=new Date();
  var pendentes=DB.lembretes?DB.lembretes.filter(function(l){return !l.feito&&new Date(l.dt)<=agora;}).length:0;
  var futuros=DB.lembretes?DB.lembretes.filter(function(l){return !l.feito&&new Date(l.dt)>agora;}).length:0;
  var total=pendentes+futuros;
  if(pendentes>0){
    btn.innerHTML='🔔 <span style="background:#ffd600;color:#000;border-radius:10px;padding:1px 5px;font-size:10px;font-weight:900;">'+pendentes+'</span>';
    btn.style.borderColor='rgba(255,214,0,.6)';
    btn.style.background='rgba(255,214,0,.15)';
  } else if(total>0){
    btn.innerHTML='🔔 <span style="background:var(--cyan);color:#000;border-radius:10px;padding:1px 5px;font-size:10px;font-weight:900;">'+total+'</span>';
    btn.style.borderColor='rgba(0,229,255,.3)';
    btn.style.background='rgba(0,229,255,.08)';
  } else {
    btn.innerHTML='🔔';
    btn.style.borderColor='rgba(255,214,0,.25)';
    btn.style.background='rgba(255,214,0,.08)';
  }
}

function verificarLembretes(){
  atualizarBadgeLembrete();
  // Sem banner — só ticker e sininho
}

function marcarLembreteFeitoId(id){
  if(!DB.lembretes)return;
  var l=DB.lembretes.find(function(x){return x.id===id;});
  if(l){l.feito=true;l.feitoEm=Date.now();}
  saveDB();
  atualizarBadgeLembrete();
  updateAlertBanner();
  abrirListaLembretes();
}
function purgarLembretesFeitos(){
  if(!DB.lembretes)return;
  var umDia=24*60*60*1000;
  var antes=DB.lembretes.length;
  DB.lembretes=DB.lembretes.filter(function(l){
    if(!l.feito)return true;
    if(!l.feitoEm)return false; // sem timestamp, remove
    return (Date.now()-l.feitoEm)<umDia;
  });
  if(DB.lembretes.length!==antes)saveDB();
}

function fecharLembreteBanner(){
  var b=document.getElementById('lembrete-banner');
  if(b)b.remove();
}

function iconeStatusFinanceiro(r){
  if(r._cancelado)return r.pago?'<span title="Cancelado pago">✅❌</span>':'<span title="Cancelado s/pagar">⏳❌</span>';
  if(r.status==='garantia'){

    if(r.entregue&&!r.pago)return'<span title="Entregue s/pagar">📦⏳</span>';

function renderContador(){

var _relMes=null,_relValVisible=null;
function renderRelatorio(){
  var el=document.getElementById('relatorio-list');if(!el)return;

  var meses={};
  var todos=DB.robos.concat((DB.lixeira||[]).map(function(x){return x.robo;}));
  todos.forEach(function(r){
    if(!r||!r.dataEntrada)return;
    var mes=r.dataEntrada.slice(0,7);// YYYY-MM
    if(!meses[mes])meses[mes]={mes:mes,entradas:0,concluidos:0,cancelados:0,faturamento:0,modelos:{},defeitos:{}};
    meses[mes].entradas++;
    if(r.status==='garantia')meses[mes].concluidos++;
    if(r.motivo==='cancelamento')meses[mes].cancelados++;
    if(r.diagnostico&&r.diagnostico.total)meses[mes].faturamento+=r.diagnostico.total;
    if(r.modelo)meses[mes].modelos[r.modelo]=(meses[mes].modelos[r.modelo]||0)+1;
    if(r.defeitos)r.defeitos.forEach(function(d){meses[mes].defeitos[d]=(meses[mes].defeitos[d]||0)+1;});
  });
  var lista=Object.values(meses).sort(function(a,b){return b.mes>a.mes?1:-1;});

    '<div style="font-size:11px;font-weight:700;color:#ff6d00;letter-spacing:1px;margin-bottom:8px;">⚠️ TOP DEFEITOS</div>'+
    topDefeitos.map(function(d,i){return'<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--border);"><span>'+(i+1)+'. '+esc(d[0])+'</span><span style="color:#ff6d00;font-weight:700;">'+d[1]+'x</span></div>';}).join('')+

function criarBotaoFlutuante(){
  if(document.getElementById('btn-fab'))return;
  var fab=document.createElement('button');
  fab.id='btn-fab';
  fab.innerHTML='<span style="font-size:22px;">+</span>';
  fab.style.cssText='position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#007ea8,#00e5ff);border:none;color:#000;font-weight:900;cursor:grab;z-index:9990;box-shadow:0 4px 20px rgba(0,229,255,.4);display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;';
  document.body.appendChild(fab);
  // Drag logic
  var isDragging=false,startX,startY,startRight,startBottom,moved=false;
  function onStart(ex,ey){
    isDragging=true;moved=false;
    startX=ex;startY=ey;
    var rect=fab.getBoundingClientRect();
    startRight=window.innerWidth-rect.right;
    startBottom=window.innerHeight-rect.bottom;
    fab.style.cursor='grabbing';
  }
  function onMove(ex,ey){
    if(!isDragging)return;
    var dx=ex-startX,dy=ey-startY;
    if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;
    var newRight=Math.max(8,Math.min(window.innerWidth-64,startRight-dx));
    var newBottom=Math.max(8,Math.min(window.innerHeight-64,startBottom-dy));
    fab.style.right=newRight+'px';
    fab.style.bottom=newBottom+'px';
    fab.style.left='auto';fab.style.top='auto';
  }
  function onEnd(){
    isDragging=false;
    fab.style.cursor='grab';
  }
  fab.addEventListener('mousedown',function(e){onStart(e.clientX,e.clientY);e.preventDefault();});
  document.addEventListener('mousemove',function(e){onMove(e.clientX,e.clientY);});
  document.addEventListener('mouseup',function(){onEnd();});
  fab.addEventListener('touchstart',function(e){onStart(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  document.addEventListener('touchmove',function(e){if(isDragging){onMove(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();}},{passive:false});
  document.addEventListener('touchend',function(){onEnd();});
  fab.onclick=function(){if(!moved){switchTab('checkin');window.scrollTo(0,0);}};
}

function bancadaBtnStyle(tipo,atual){
  var base='border-radius:6px;padding:4px 10px;font-size:14px;cursor:pointer;border:1px solid ';
  if(tipo===atual){
    if(tipo==='veio')return base+'#00e676;background:rgba(0,230,118,.2);';
    if(tipo==='nao')return base+'#ff1744;background:rgba(255,23,68,.2);';
    return base+'#555;background:rgba(100,100,100,.2);color:#888;';
  }
  return base+'var(--border);background:var(--bg3);color:var(--text3);';
}
function bancadaBtnStyle2(tipo,atual){
  var base='flex:1;border-radius:8px;padding:8px;font-family:\'Rajdhani\',sans-serif;font-size:13px;font-weight:700;cursor:pointer;border:1px solid ';
  if(tipo===atual)return base+'var(--cyan);background:rgba(0,229,255,.15);color:var(--cyan);';
  return base+'var(--border);background:var(--bg2);color:var(--text3);';
}
function setBancadaItem(id,estado){

  window._bancadaEstado.itens[id]=estado;
  ['veio','nao',''].forEach(function(t){
    var btn=document.getElementById('bi-'+(t||'sem')+'-'+id);

function setBancadaExtra(tipo,val){
  if(!window._bancadaEstado)window._bancadaEstado={};

  if(tipo==='outra'){

    ['intacto','violado','sem'].forEach(function(t){

}
function salvarBancada(roboId,enviarWA){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var c=DB.clientes.find(function(x){return x.id===r.clienteId;});
  if(!window._bancadaEstado)window._bancadaEstado={itens:{}};
  if(!window._bancadaEstado.itens)window._bancadaEstado.itens={};
  window._bancadaEstado.obsItens=document.getElementById('bancada-obs-itens')?document.getElementById('bancada-obs-itens').value:'';
  window._bancadaEstado.obs=document.getElementById('bancada-obs')?document.getElementById('bancada-obs').value:'';
  window._bancadaEstado.data=todayISO();
  window._bancadaEstado.modo=_bancadaModo;
  // deep copy para garantir que itens são salvos corretamente
  r.bancada=JSON.parse(JSON.stringify(window._bancadaEstado));
  r.entradaBancada=true;
  saveDB();
  if(enviarWA&&c){
    var msg=gerarMsgBancada(r,c);
    var wa=c.whatsapp.replace(/\D/g,'');
    if(wa.length===11)wa='55'+wa;
    closeModal();
    window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank');
    showToast('🔧 Bancada salva e WhatsApp aberto!');
  } else {
    closeModal();
    showToast('🔧 Entrada na bancada salva!');
  }
  // força refresh da ficha se estiver aberta
  if(fichaClienteId)refreshFichaContent();
}
function gerarMsgBancada(r,c){
  var num=r.numOS||('#'+String(r.numVisual).padStart(3,'0'));
  var nome=c?c.nome:'cliente';
  var tipo=c?c.tipo:'cf';
  var b=r.bancada||{};
  var itens=b.itens||{};
  var msg='Olá, *'+nome+'*! 👋\n\n';
  msg+='Seu robô *'+num+' — '+esc(r.modelo||'—')+'* acabou de dar entrada na bancada da *MoLeDo ElEtRoTeCh*! 🔧🤖\n\n';
  // checklist
  var vieram=[];var naoVieram=[];
  CHECKLIST_ITENS.forEach(function(item){
    var e=itens[item.id]||'';
    if(e==='veio')vieram.push('✅ '+item.nome);
    else if(e==='nao')naoVieram.push('❌ '+item.nome);
  });
  if(vieram.length){msg+='*📦 Itens recebidos:*\n'+vieram.join('\n')+'\n';}
  if(naoVieram.length){msg+='\n*⚠️ Não recebidos:*\n'+naoVieram.join('\n')+'\n';}
  if(b.obsItens)msg+='\n📝 _'+b.obsItens+'_\n';
  msg+='\n';
  if(b.outraAssistencia==='sim')msg+='🔄 *Veio de outra assistência:* Sim\n';
  if(b.selo)msg+='🔒 *Selo de garantia:* '+(b.selo==='intacto'?'Intacto ✅':b.selo==='violado'?'Violado ⚠️':'Sem selo ❌')+'\n';
  if(b.obs)msg+='\n📋 *Observação:* '+b.obs+'\n';
  // fotos (só para cliente final ou vendedor+cliente)
  if(tipo!=='vd'){
    msg+='\n📸 *Em seguida enviarei as fotos na seguinte ordem:*\n';
    msg+='1️⃣ Estado geral do robô\n';
    if(itens.vassoura_central==='veio')msg+='2️⃣ Vassoura central\n';
    if(itens.vassoura_lat_esq==='veio'||itens.vassoura_lat_dir==='veio')msg+='3️⃣ Vassouras laterais\n';
    msg+='4️⃣ Estado das rodas\n';
    if(itens.reservatorio_poco==='veio')msg+='5️⃣ Reservatório de poeira/filtro\n';
    if(itens.reservatorio_agua==='veio')msg+='6️⃣ Reservatório de água\n';
    if(itens.carregador_dock==='veio')msg+='7️⃣ Base/Dock de carregamento\n';
    msg+='\n*Por favor, confirme se é exatamente assim que chegou até você!* ✅';
  }
  msg+='\n\n_\n*MoLeDo ElEtRoTeCh*\nReparo é nossa linguagem · Tecnologia é nossa paixão_';
  return msg;
}

// ── BACKUP GOOGLE DRIVE ──
function fazerBackup(){
  var dados=JSON.stringify(DB,null,2);
  var hoje=new Date();
  var nome='moledo-backup-'+hoje.toISOString().slice(0,10)+'.json';
  var blob=new Blob([dados],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=nome;a.click();
  URL.revokeObjectURL(url);
  showToast('💾 Backup baixado: '+nome);
}
function verificarBackupSemanal(){
  var hoje=new Date();
  if(hoje.getDay()===5){// sexta-feira
    var ultimoBackup=localStorage.getItem('moledo_ultimo_backup');
    var semana=hoje.toISOString().slice(0,10);
    if(ultimoBackup!==semana){
      localStorage.setItem('moledo_ultimo_backup',semana);
      setTimeout(function(){
        if(confirm('💾 Backup semanal automático!\n\nDeseja baixar o backup dos seus dados agora?')){
          fazerBackup();
        }
      },3000);
    }
  }
}

function autocompleteCliente(val){
  var box=document.getElementById('ci-autocomplete');
  if(!val||val.length<2){box.style.display='none';return;}
  var matches=DB.clientes.filter(function(c){return c.nome.toLowerCase().indexOf(val.toLowerCase())!==-1;});
