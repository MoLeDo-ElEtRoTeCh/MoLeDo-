<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MoLeDo ElEtRoTeCh</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c10;--bg2:#0e1118;--bg3:#131720;--card:#111520;--card2:#161c2a;
  --border:#1e2d45;--cyan:#00e5ff;--cyan2:#00b8d9;--cyan3:#007ea8;
  --green:#00e676;--yellow:#ffd600;--orange:#ff6d00;--red:#ff1744;
  --purple:#aa00ff;--purple2:#7c00c9;
  --text:#e0f0ff;--text2:#8899bb;--text3:#556688;
  --shadow:0 4px 24px rgba(0,229,255,.08);
  --glow-strong:0 0 32px rgba(0,229,255,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;font-size:15px;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--cyan3);border-radius:2px;}
#app-header{background:linear-gradient(135deg,#060a12,#0a1428,#060a12);border-bottom:2px solid var(--cyan3);padding:10px 16px 28px;flex-shrink:0;position:relative;overflow:hidden;text-align:center;}
#app-header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(0,229,255,.02) 60px,rgba(0,229,255,.02) 61px);pointer-events:none;}
.header-logo{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;color:var(--cyan);text-shadow:var(--glow-strong);letter-spacing:2px;text-align:center;}
.header-logo span{color:#fff;text-shadow:none;}
.header-tagline{font-family:'Share Tech Mono',monospace;font-size:10px;color:#00b8d9;letter-spacing:1.5px;margin-top:3px;text-transform:uppercase;text-align:center;}
.header-sub{font-size:10px;color:#667788;margin-top:1px;text-align:center;}
#alert-banner{background:linear-gradient(90deg,#1a0500,#2a0800,#1a0500);border-bottom:2px solid var(--orange);color:var(--orange);padding:8px 16px;font-weight:700;font-size:13px;display:none;align-items:center;gap:8px;flex-shrink:0;}
#tabs-bar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg2);border-bottom:2px solid var(--border);flex-shrink:0;}
.tab-btn{padding:9px 2px 7px;background:none;border:none;color:var(--text3);font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;text-align:center;line-height:1.3;}
.tab-btn:nth-child(-n+4){border-bottom:1px solid var(--border);}
.tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan)!important;background:rgba(0,229,255,.07);}
.tab-badge{display:inline-block;background:var(--red);color:#fff;border-radius:8px;font-size:9px;padding:0 4px;margin-left:2px;min-width:14px;text-align:center;font-weight:700;vertical-align:middle;}
.tab-badge.orange{background:var(--orange);}
.tab-badge.gray{background:var(--text3);}
.tab-badge.yellow{background:var(--yellow);color:#000;}
#content{flex:1;overflow-y:auto;padding:12px;padding-bottom:24px;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cyan3),transparent);opacity:.4;}
.card.green-card::before{background:linear-gradient(90deg,transparent,var(--green),transparent);}
.card.yellow-card::before{background:linear-gradient(90deg,transparent,var(--yellow),transparent);}
.card.red-card{border-color:rgba(255,23,68,.4);}
.card.red-card::before{background:linear-gradient(90deg,transparent,var(--red),transparent);}
.card.orange-card{border-color:rgba(255,109,0,.5);}
.card.orange-card::before{background:linear-gradient(90deg,transparent,var(--orange),transparent);}
.card.purple-card{border-color:rgba(170,0,255,.35);}
.card.purple-card::before{background:linear-gradient(90deg,transparent,var(--purple2),transparent);}
.card.trash-card{border-color:rgba(255,255,255,.1);opacity:.75;}
.card.trash-card::before{background:linear-gradient(90deg,transparent,var(--text3),transparent);}
.card.diag-card{border-color:rgba(255,214,0,.3);}
.card.diag-card::before{background:linear-gradient(90deg,transparent,var(--yellow),transparent);}
.client-card{cursor:pointer;transition:all .2s;}
.client-name{font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;}
.client-wa{font-size:13px;color:var(--cyan2);margin-bottom:8px;}
.client-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid transparent;}
.tag.total{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.3);color:var(--cyan);}
.tag.reparo{background:rgba(21,101,192,.2);border-color:rgba(21,101,192,.4);color:#64b5f6;}
.tag.garantia{background:rgba(170,0,255,.1);border-color:rgba(170,0,255,.3);color:#ce93d8;}
.tag.atraso{background:rgba(255,109,0,.15);border-color:rgba(255,109,0,.4);color:var(--orange);}
.client-meta{font-size:12px;color:var(--text3);display:flex;gap:12px;flex-wrap:wrap;}
.robot-num{font-family:'Share Tech Mono',monospace;font-size:22px;font-weight:700;color:var(--cyan);}
.robot-sn{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text2);margin-top:1px;}
.robot-model{font-size:14px;font-weight:700;color:#fff;margin-top:3px;}
.robot-volt{font-size:11px;color:var(--yellow);font-weight:700;margin-top:2px;}
.robot-defects{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;}
.defect-chip{background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.2);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--cyan2);}
.robot-meta{font-size:12px;color:var(--text3);margin-bottom:8px;line-height:1.7;}
.robot-actions{display:flex;gap:6px;flex-wrap:wrap;}
.cliente-label{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.5px;margin-bottom:2px;}
.wa-last{font-size:11px;color:#25d366;margin-bottom:6px;padding:5px 8px;background:rgba(37,211,102,.06);border-left:3px solid rgba(37,211,102,.35);border-radius:0 6px 6px 0;}
.diag-badge{font-size:11px;color:var(--yellow);margin-bottom:6px;padding:5px 8px;background:rgba(255,214,0,.06);border-left:3px solid rgba(255,214,0,.35);border-radius:0 6px 6px 0;font-weight:700;}
.status-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:6px;}
.status-verde{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.4);color:var(--green);}
.status-amarelo{background:rgba(255,214,0,.1);border:1px solid rgba(255,214,0,.4);color:var(--yellow);}
.status-vermelho{background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.4);color:var(--red);}
.status-critico{background:rgba(255,109,0,.15);border:1px solid rgba(255,109,0,.5);color:var(--orange);animation:blink .8s infinite;}
.status-garantia{background:rgba(170,0,255,.1);border:1px solid rgba(170,0,255,.4);color:#ce93d8;}
.status-lixeira{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:var(--text3);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.6;}}
.days-big{font-family:'Share Tech Mono',monospace;font-size:28px;font-weight:700;line-height:1;}
.days-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;}
.garantia-shield{font-size:28px;margin-bottom:4px;}
.garantia-days{font-family:'Share Tech Mono',monospace;font-size:20px;color:var(--purple);font-weight:700;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;border:none;font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.btn-cyan{background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.4);color:var(--cyan);}
.btn-green{background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.4);color:var(--green);}
.btn-wa{background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.4);color:#25d366;}
.btn-yellow{background:rgba(255,214,0,.12);border:1px solid rgba(255,214,0,.4);color:var(--yellow);}
.btn-primary{background:linear-gradient(135deg,#007ea8,#005f7f);border:1px solid var(--cyan3);color:#fff;padding:12px 20px;border-radius:10px;font-size:15px;}
.btn-close{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text2);}
.btn-edit{background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.3);color:var(--cyan2);}
.btn-del{background:rgba(255,23,68,.08);border:1px solid rgba(255,23,68,.3);color:var(--red);}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.form-label span{color:var(--red);}
.form-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--cyan3);}
.form-input::placeholder{color:var(--text3);}
.form-input:disabled{opacity:.4;}
textarea.form-input{resize:vertical;min-height:70px;}
select.form-input{cursor:pointer;}
.volt-row{display:flex;gap:8px;flex-wrap:wrap;}
.volt-btn{padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;}
.volt-btn.sel{background:rgba(255,214,0,.12);border-color:rgba(255,214,0,.5);color:var(--yellow);}
.wa-tipos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
.wa-tipo-btn{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.wa-tipo-btn.sel{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.4);color:#25d366;}
.wa-tipo-btn.disabled{opacity:.35;cursor:not-allowed;}
.wa-hist{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:12px;}
.wa-hist-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.wa-hist-item{font-size:12px;color:var(--text2);margin-bottom:3px;}
.qty-selector{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:4px 8px;width:fit-content;}
.qty-btn{width:36px;height:36px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);border-radius:6px;color:var(--cyan);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;}
.qty-val{font-family:'Share Tech Mono',monospace;font-size:22px;color:#fff;min-width:30px;text-align:center;}
.robot-block{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.robot-block-title{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--cyan);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.defect-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.defect-btn{padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Rajdhani',sans-serif;}
.defect-btn.sel{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.5);color:var(--cyan);}
.defect-category{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin:10px 0 5px;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:6px 0;}
.checkbox-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--cyan);cursor:pointer;}
.checkbox-row label{font-size:13px;color:var(--text2);cursor:pointer;}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;align-items:center;justify-content:center;padding:16px;}
#modal-overlay.open{display:flex;}
.modal{background:var(--card2);border:1px solid var(--cyan3);border-radius:16px;padding:20px;max-width:460px;width:100%;box-shadow:0 0 60px rgba(0,229,255,.15);animation:modal-in .2s ease-out;max-height:92vh;overflow-y:auto;}
@keyframes modal-in{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-title{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:16px;}
.modal-title.danger{color:var(--red);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.section-title{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;color:var(--cyan2);letter-spacing:2px;text-transform:uppercase;margin:16px 0 10px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--cyan3),transparent);}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;}
.empty-state p{font-size:13px;line-height:1.6;}
.divider{height:1px;background:var(--border);margin:10px 0;}
.back-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;color:var(--cyan);font-weight:700;font-size:14px;}
.trash-info{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text3);margin-bottom:10px;line-height:1.5;}
#ficha-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:500;flex-direction:column;overflow:hidden;}
#ficha-overlay.open{display:flex;}
#ficha-header{background:var(--card2);border-bottom:1px solid var(--border);padding:12px 16px;flex-shrink:0;}
#ficha-content{flex:1;overflow-y:auto;padding:12px;}
#diag-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:600;flex-direction:column;overflow:hidden;}
#diag-overlay.open{display:flex;}
#diag-header{background:var(--card2);border-bottom:2px solid var(--yellow);padding:12px 16px;flex-shrink:0;}
#diag-content{flex:1;overflow-y:auto;padding:12px;}
#config-overlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:700;flex-direction:column;overflow:hidden;}
#config-overlay.open{display:flex;}
#config-header{background:var(--card2);border-bottom:2px solid var(--cyan3);padding:12px 16px;flex-shrink:0;}
#config-content{flex:1;overflow-y:auto;padding:12px;}
.diag-item-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
.diag-item-row.sel{border-color:var(--yellow);background:rgba(255,214,0,.05);}
.diag-item-check{width:18px;height:18px;accent-color:var(--yellow);cursor:pointer;flex-shrink:0;}
.diag-item-info{flex:1;}
.diag-item-nome{font-size:13px;color:var(--text);font-weight:600;}
.diag-item-preco{width:110px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:13px;text-align:right;outline:none;}
.diag-item-preco:focus{border-color:var(--yellow);}
.abertura-row{display:flex;gap:8px;margin-bottom:4px;}
.abertura-btn{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--bg2);color:var(--text2);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;}
.abertura-btn.sel{border-color:var(--yellow);background:rgba(255,214,0,.1);color:var(--yellow);}
.diag-total-box{background:var(--bg2);border:2px solid var(--cyan3);border-radius:12px;padding:14px;margin:12px 0;}
.diag-total-linha{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);margin-bottom:6px;}
.diag-total-linha.total{font-size:16px;font-weight:700;color:#fff;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.diag-total-linha.desconto{color:var(--red);}
.diag-total-linha.avista{color:var(--green);font-weight:700;}
.calc-box{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;}
.calc-title{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.calc-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.calc-row:last-child{border-bottom:none;}
.calc-label{color:var(--text2);}
.calc-val{font-family:'Share Tech Mono',monospace;color:var(--cyan);font-weight:700;font-size:12px;}
.parcela-btns{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0;}
.parcela-btn{padding:6px 11px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
.parcela-btn.sel{border-color:var(--cyan);background:rgba(0,229,255,.12);color:var(--cyan);}
.config-cat-title{font-size:11px;font-weight:700;color:var(--cyan2);letter-spacing:1px;text-transform:uppercase;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border);}
.config-item-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;}
.config-item-card.inativo{opacity:.5;}
.config-item-header{display:flex;align-items:center;justify-content:space-between;}
.config-item-nome{font-size:13px;color:var(--text);font-weight:700;}
.config-item-cat{font-size:11px;color:var(--text3);margin-top:2px;}
.config-item-actions{display:flex;gap:5px;flex-shrink:0;}
.config-btn{padding:5px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;font-weight:700;cursor:pointer;font-family:'Rajdhani',sans-serif;}
.config-btn.edit{border-color:rgba(0,229,255,.3);color:var(--cyan2);}
.config-btn.del{border-color:rgba(255,23,68,.3);color:var(--red);}
.config-btn.toggle{border-color:rgba(0,230,118,.3);color:var(--green);}
.config-btn.toggle.off{border-color:rgba(255,255,255,.1);color:var(--text3);}
.cancel-sel-btn{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);background:var(--bg2);color:var(--text2);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-align:center;}
.cancel-sel-btn.ativo-yellow{border-color:var(--yellow);background:rgba(255,214,0,.1);color:var(--yellow);}
.cancel-sel-btn.ativo-red{border-color:var(--red);background:rgba(255,23,68,.1);color:var(--red);}
.etq-robo-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .2s;}
.etq-robo-row.sel{border-color:var(--cyan);background:rgba(0,229,255,.06);}
.etq-robo-row.impressa{border-color:rgba(0,230,118,.3);background:rgba(0,230,118,.04);}
.etq-robo-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--cyan);cursor:pointer;flex-shrink:0;}
.etq-robo-info{flex:1;}
.etq-robo-num{font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--cyan);font-weight:700;}
.etq-robo-det{font-size:12px;color:var(--text2);}
.etq-robo-actions{display:flex;gap:6px;flex-shrink:0;}
#etq-overlay{display:none;position:fixed;inset:0;background:#fff;z-index:3000;flex-direction:column;}
#etq-overlay.open{display:flex;}
#etq-toolbar{background:#f0f0f0;border-bottom:2px solid #ccc;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
#etq-body{flex:1;overflow-y:auto;background:#ddd;padding:10px;}
#etq-folha{width:190mm;margin:0 auto;background:#fff;padding:2mm;display:grid;grid-template-columns:repeat(4,47mm);grid-template-rows:auto;gap:1mm;box-sizing:border-box;}
.etq-item{width:47mm;height:28mm;border:0.5px solid #ccc;border-radius:1mm;padding:1mm 0mm 1mm 2mm;display:flex;align-items:stretch;overflow:hidden;box-sizing:border-box;font-family:Arial,sans-serif;background:#fff;color:#000;}
.etq-item.vazia{visibility:hidden;border:none;}
.etq-item-left{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding-right:1mm;overflow:hidden;}
.etq-item-right{width:17mm;flex-shrink:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:0;}
.etq-cli{font-size:10pt;font-weight:900;color:#000;line-height:1.1;word-break:break-word;}
.etq-num{font-size:11pt;font-weight:900;color:#000;line-height:1;}
.etq-dat{font-size:6pt;color:#444;margin-top:0.5mm;}
.etq-qr-fixed{width:17mm;height:17mm;display:block;}
.etq-btn-back{background:#555;color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:15px;cursor:pointer;font-family:Arial;font-weight:700;}
.etq-btn-print{background:#007ea8;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:15px;cursor:pointer;font-family:Arial;font-weight:700;}
@media print{
  #etq-toolbar{display:none!important;}
  #etq-body{overflow:visible!important;background:#fff!important;padding:0!important;}
  body>*:not(#etq-overlay){display:none!important;}
  #etq-overlay{position:static!important;background:#fff!important;}
  @page{size:A4 portrait;margin:5mm;}
}
/* ── SYNC TOAST CENTRAL ── */
#sync-toast{
  display:none;position:fixed;inset:0;z-index:99999;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  pointer-events:none;
}
#sync-toast.show{display:flex;}
.sync-box{
  background:linear-gradient(135deg,#0e1520,#111d30);
  border:1.5px solid rgba(0,229,255,.4);
  border-radius:20px;
  padding:28px 36px;
  text-align:center;
  box-shadow:0 0 60px rgba(0,229,255,.18),0 8px 40px rgba(0,0,0,.6);
  min-width:200px;
  animation:sync-pop .25s cubic-bezier(.34,1.56,.64,1);
}
@keyframes sync-pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.sync-robot{
  font-size:48px;line-height:1;
  display:inline-block;
  animation:robot-spin 0.7s linear infinite;
  filter:drop-shadow(0 0 12px rgba(0,229,255,.7));
}
@keyframes robot-spin{
  0%{transform:rotate(-15deg) scale(1);}
  25%{transform:rotate(0deg) scale(1.08);}
  50%{transform:rotate(15deg) scale(1);}
  75%{transform:rotate(0deg) scale(1.08);}
  100%{transform:rotate(-15deg) scale(1);}
}
.sync-orbit{
  width:70px;height:70px;
  border-radius:50%;
  border:2px solid rgba(0,229,255,.15);
  border-top-color:var(--cyan);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;
  animation:orbit-spin 1.2s linear infinite;
  position:relative;
}
@keyframes orbit-spin{to{transform:rotate(360deg);}}
.sync-orbit-inner{
  width:54px;height:54px;border-radius:50%;
  border:2px solid rgba(0,229,255,.08);
  border-bottom-color:rgba(0,229,255,.5);
  animation:orbit-spin 0.8s linear infinite reverse;
  display:flex;align-items:center;justify-content:center;
  position:absolute;
}
.sync-robot-inner{font-size:26px;animation:robot-spin 0.7s linear infinite;}
.sync-label{
  font-family:'Orbitron',monospace;
  font-size:13px;font-weight:700;
  color:var(--cyan);
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:4px;
}
.sync-sub{font-size:11px;color:var(--text3);letter-spacing:.5px;}
.sync-dots span{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--cyan);margin:0 2px;
  animation:dot-pulse 1.2s ease-in-out infinite;
}
.sync-dots span:nth-child(2){animation-delay:.2s;}
.sync-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dot-pulse{0%,80%,100%{opacity:.2;transform:scale(.8);}40%{opacity:1;transform:scale(1.2);}}
</style>
</head>

function saveDB(){try{localStorage.setItem('moledo_v5',JSON.stringify(DB));}catch(e){}
  if(window._fbReady)syncToFirebase();
}
function loadDB(){
  try{var r=localStorage.getItem('moledo_v5');if(r)DB=JSON.parse(r);}catch(e){}
  try{var old=localStorage.getItem('moledo_v4');if(old&&!DB.clientes.length){var o=JSON.parse(old);DB.clientes=o.clientes||[];DB.robos=o.robos||[];DB.lixeira=o.lixeira||[];}}catch(e){}
  if(!DB.clientes)DB.clientes=[];if(!DB.robos)DB.robos=[];if(!DB.lixeira)DB.lixeira=[];if(!DB.catalogo)DB.catalogo=[];if(!DB.defeitosCI)DB.defeitosCI=[];
  if(DB.taxas)Object.assign(TAXAS,DB.taxas);
  DB.robos.forEach(function(r){if(!r.mensagens)r.mensagens=[];if(r.diagnostico===undefined)r.diagnostico=null;});
  if((DB.versaoCatalogo||0)<2){DB.catalogo=CAT_PAD.map(function(x){return Object.assign({id:genId()},x);});DB.versaoCatalogo=2;saveDB();}
  // repopula defeitos do checkin se vazio (inclusive após sync do Firebase)
  if(!DB.defeitosCI||!DB.defeitosCI.length){
    DB.defeitosCI=[];
    DEFEITOS.forEach(function(cat){cat.items.forEach(function(item){DB.defeitosCI.push({id:genId(),cat:cat.cat,nome:item,ativo:true});});});
    saveDB();
  }
}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function diasDesde(iso){var d=new Date(iso+'T00:00:00'),h=new Date();h.setHours(0,0,0,0);return Math.floor((h-d)/86400000);}
function fmtData(iso){if(!iso)return'—';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtVal(v){return'R$ '+Number(v).toFixed(2).replace('.',',');}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];}
function todayISO(){return new Date().toISOString().split('T')[0];}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getStatusInfo(d){
  if(d<=15)return{cls:'status-verde',txt:'Dentro do prazo inicial',cardCls:'green-card'};
  if(d<=35)return{cls:'status-amarelo',txt:'Em análise / atenção',cardCls:'yellow-card'};
  if(d<=40)return{cls:'status-vermelho',txt:'Próximo do atraso',cardCls:'red-card'};
  return{cls:'status-critico',txt:'CRÍTICO — Mais de 40 dias',cardCls:'orange-card'};
}
function dc(d){return d>40?'var(--orange)':d>35?'var(--red)':d>15?'var(--yellow)':'var(--green)';}
function getAtivos(cId){return DB.robos.filter(function(r){return r.clienteId===cId&&r.status==='reparo';});}
function getGar(cId){return DB.robos.filter(function(r){return r.clienteId===cId&&r.status==='garantia';});}
function getAtras(cId){return DB.robos.filter(function(r){return r.clienteId===cId&&r.status==='reparo'&&diasDesde(r.dataEntrada)>40;});}
function getMaior(cId){var a=getAtivos(cId);return a.length?Math.max.apply(null,a.map(function(r){return diasDesde(r.dataEntrada);})):0;}
function getCats(){var c=[];DB.catalogo.forEach(function(x){if(c.indexOf(x.cat)===-1)c.push(x.cat);});return c.sort();}
function switchTab(tab){
  document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.add('active');
  var names=['clientes','checkin','fila','alertas','garantia','lixeira','etiqueta','diagnostico'];
  var idx=names.indexOf(tab);var btns=document.querySelectorAll('.tab-btn');
  if(idx>=0&&btns[idx])btns[idx].classList.add('active');
  currentTab=tab;renderTab(tab);
}
function renderTab(tab){
  if(tab==='clientes')renderClientes();
  else if(tab==='checkin')renderCheckin();
  else if(tab==='fila')renderFila();
  else if(tab==='alertas')renderAlertas();
  else if(tab==='garantia')renderGarantia();
  else if(tab==='lixeira')renderLixeira();
  else if(tab==='etiqueta')renderEtiqueta();
  else if(tab==='diagnostico')renderDiagnosticoLista();
}
function renderAll(){purgarLixeira();updateAlertBanner();renderBadges();renderTab(currentTab);renderContador();}
function updateAlertBanner(){
  var c=DB.robos.filter(function(r){return r.status==='reparo'&&diasDesde(r.dataEntrada)>40;});
  var el=document.getElementById('alert-banner');
  if(c.length){document.getElementById('alert-text').textContent=c.length+' robô(s) há mais de 40 dias em reparo!';el.style.display='flex';}
  else el.style.display='none';
}
function renderBadges(){
  var al=DB.robos.filter(function(r){return r.status==='reparo'&&diasDesde(r.dataEntrada)>35;});
  var b=document.getElementById('badge-alertas');
  if(al.length){b.textContent=al.length;b.style.display='inline-block';b.className='tab-badge'+(al.some(function(r){return diasDesde(r.dataEntrada)>40;})?' orange':'');}
  else b.style.display='none';
  var bl=document.getElementById('badge-lixeira');
  if(DB.lixeira.length){bl.textContent=DB.lixeira.length;bl.style.display='inline-block';}else bl.style.display='none';
  var sd=DB.robos.filter(function(r){return r.status==='reparo'&&!r.diagnostico;}).length;
  var bd=document.getElementById('badge-diag');
  if(sd){bd.textContent=sd;bd.style.display='inline-block';}else bd.style.display='none';
}
function renderClientes(){
  var el=document.getElementById('clientes-list');
  verificarVendedoresInativos();
  var hoje=new Date();hoje.setHours(0,0,0,0);
  var lista=[...DB.clientes].sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR');});
  if(filtroCliente==='cf')lista=lista.filter(function(c){return !c.tipo||c.tipo==='cf';});
  else if(filtroCliente==='vd')lista=lista.filter(function(c){return c.tipo==='vd'||c.tipo==='vc';});
  else if(filtroCliente==='inativo')lista=lista.filter(function(c){return c.inativo;});
  if(!lista.length){el.innerHTML='<div class="empty-state"><div class="empty-icon">👤</div><p>Nenhum cliente encontrado.<br>Use a aba Check-in.</p></div>';return;}
  el.innerHTML=lista.map(function(c){
    var ativos=getAtivos(c.id),gars=getGar(c.id),atras=getAtras(c.id);
    var total=DB.robos.filter(function(r){return r.clienteId===c.id;}).length;
    var datas=DB.robos.filter(function(r){return r.clienteId===c.id;}).map(function(r){return r.dataEntrada;}).sort().reverse();
    var tipoBadge='';
    if(c.tipo==='vd')tipoBadge='<span style="background:rgba(255,214,0,.15);border:1px solid rgba(255,214,0,.3);color:#ffd600;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px;">🏪 Vendedor</span>';
    else if(c.tipo==='vc')tipoBadge='<span style="background:rgba(170,0,255,.15);border:1px solid rgba(170,0,255,.3);color:#aa00ff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px;">🤝 Vend+Cliente'+(c.nomeClienteFinal?' | '+esc(c.nomeClienteFinal):'')+'</span>';
    var inativoBadge=c.inativo?'<span style="background:rgba(100,100,100,.2);border:1px solid #555;color:#888;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px;">💤 Inativo</span>':'';
    // dias inativo
    var diasInativo='';
    if(c.inativo&&c.dataInativo){
      var di=new Date(c.dataInativo);di.setHours(0,0,0,0);
      diasInativo='<span style="color:#888;font-size:11px;">💤 '+Math.floor((hoje-di)/(1000*60*60*24))+' dias sem robô</span>';
    }
    return'<div class="card client-card" onclick="openClienteDetalhe(\''+c.id+'\')" style="'+(c.inativo?'opacity:.7':'')+'">'+
      '<div class="client-name">'+esc(c.nome)+tipoBadge+inativoBadge+'</div><div class="client-wa">📱 '+esc(c.whatsapp)+'</div>'+
      '<div class="client-tags"><span class="tag total">📦 Total: '+total+'</span>'+
      (ativos.length?'<span class="tag reparo">🔧 Reparo: '+ativos.length+'</span>':'')+
      (gars.length?'<span class="tag garantia">🛡️ Garantia: '+gars.length+'</span>':'')+
      (atras.length?'<span class="tag atraso">⚠️ Atrasados: '+atras.length+'</span>':'')+
      '</div><div class="client-meta">'+
      (datas[0]?'<span>📅 Última entrada: '+fmtData(datas[0])+'</span>':'')+
      (getMaior(c.id)?'<span>⏱️ Mais antigo: '+getMaior(c.id)+' dias</span>':'')+
      diasInativo+
      '</div></div>';
  }).join('');
}
function openClienteDetalhe(id){
  var c=DB.clientes.find(function(x){return x.id===id;});if(!c)return;
  fichaClienteId=id;
  document.getElementById('ficha-nome').textContent=c.nome;
  document.getElementById('ficha-wa').textContent='📱 '+c.whatsapp;
  refreshFichaContent();
  document.getElementById('ficha-overlay').classList.add('open');
}
function refreshFichaContent(){
  if(!fichaClienteId)return;
  var robos=DB.robos.filter(function(r){return r.clienteId===fichaClienteId;});
  document.getElementById('ficha-content').innerHTML=robos.length?robos.map(function(r){return renderRoboCard(r,true);}).join(''):'<div class="empty-state"><div class="empty-icon">🤖</div><p>Nenhum robô.</p></div>';
}
function closeClienteDetalhe(){document.getElementById('ficha-overlay').classList.remove('open');fichaClienteId=null;renderClientes();}
function editarCliente(){

function salvarEdicaoCliente(id){
  var c=DB.clientes.find(function(x){return x.id===id;});if(!c)return;
  var nome=document.getElementById('ec-nome').value.trim();
  var wa=document.getElementById('ec-wa').value.trim();

function renderRoboCard(r,showEntregue){

  var cc=r.status==='garantia'?'purple-card':(si?si.cardCls:'');
  if(r.diagnostico)cc+=' diag-card';
  var defHtml=r.defeitos&&r.defeitos.length?'<div class="robot-defects">'+r.defeitos.map(function(d){return'<span class="defect-chip">'+esc(d)+'</span>';}).join('')+'</div>':'';
  var statusHtml=si?'<span class="status-badge '+si.cls+'">'+si.txt+'</span>':(r.status==='garantia'?'<span class="status-badge status-garantia">🛡️ Em Garantia</span>':'');
  var msgs=r.mensagens||[];
  var waHtml=msgs.length?'<div class="wa-last">💬 Último envio: '+fmtData(msgs[msgs.length-1].data)+' — '+(WA_LABELS[msgs[msgs.length-1].tipo]||msgs[msgs.length-1].tipo)+'</div>':'';

  return'<div class="card '+cc.trim()+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'+
    '<div><div class="robot-num">'+num+'</div><div class="robot-sn">'+esc(r.sn)+'</div><div class="robot-model">'+esc(r.modelo)+'</div>'+(r.voltagem&&r.voltagem!=='—'?'<div class="robot-volt">⚡ '+esc(r.voltagem)+'</div>':'')+'</div>'+
    '<div style="text-align:right;">'+(r.status==='reparo'?'<div class="days-big" style="color:'+dc(dias)+'">'+dias+'</div><div class="days-label">dias</div>':'')+(r.status==='garantia'?'<div class="garantia-shield">🛡️</div>':'')+'</div></div>'+
    statusHtml+defHtml+diagHtml+waHtml+
    '<div class="robot-meta">📅 Entrada: '+fmtData(r.dataEntrada)+(r.dataEntrega?' · 📦 Entrega: '+fmtData(r.dataEntrega):'')+(r.obs?'<br>📝 '+esc(r.obs):'')+'</div>'+

    '<button class="btn btn-wa" onclick="abrirWhatsApp(this.dataset.id)" data-id="'+r.id+'">💬 WhatsApp</button>'+
    (r.status==='reparo'&&showEntregue?'<button class="btn btn-green" onclick="confirmarEntrega(this.dataset.id)" data-id="'+r.id+'">✅ Entregue</button>':'')+
    (r.status==='reparo'&&showEntregue?'<button class="btn btn-del" onclick="abrirCancelamento(this.dataset.id)" data-id="'+r.id+'">❌ Cancelar</button>':'')+
    (r.status==='garantia'?'<button class="btn btn-del" onclick="moverParaLixeira(this.dataset.id)" data-id="'+r.id+'">🗑️ Apagar</button>':'')+

function moverParaLixeira(roboId){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var c=DB.clientes.find(function(x){return x.id===r.clienteId;});
  var num='#'+String(r.numVisual).padStart(3,'0');
  openModal('<div class="modal-title danger">🗑️ Mover para Lixeira</div>'+
    '<div style="font-size:13px;color:var(--text2);margin-bottom:16px;">O robô <strong style="color:var(--cyan);">'+num+'</strong>'+(c?' de <strong>'+esc(c.nome)+'</strong>':'')+' será movido para a lixeira.</div>'+
    '<div class="modal-actions"><button class="btn btn-close" onclick="closeModal()">Cancelar</button><button class="btn btn-del" onclick="executarMoverLixeira(\''+roboId+'\')">🗑️ Mover</button></div>');
}
function executarMoverLixeira(roboId){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var c=DB.clientes.find(function(x){return x.id===r.clienteId;});
  DB.lixeira.push({id:genId(),robo:JSON.parse(JSON.stringify(r)),nomeCliente:c?c.nome:'?',dataApagado:todayISO()});
  DB.robos=DB.robos.filter(function(x){return x.id!==roboId;});
  if(c&&DB.robos.filter(function(x){return x.clienteId===c.id;}).length===0)DB.clientes=DB.clientes.filter(function(x){return x.id!==c.id;});
  saveDB();closeModal();if(fichaClienteId)refreshFichaContent();renderAll();showToast('🗑️ Movido para a lixeira.');
}

    '<div class="modal-actions"><button class="btn btn-close" onclick="closeModal()">Cancelar</button><button class="btn btn-del" onclick="executarExcluirPermanente(\''+itemId+'\')">⛔ Sim, excluir</button></div>');

function executarExcluirPermanente(itemId){DB.lixeira=DB.lixeira.filter(function(x){return x.id!==itemId;});saveDB();closeModal();renderAll();showToast('⛔ Excluído permanentemente.');}

function enviarWACancel(){
  if(!CD.motivo){alert('Selecione o motivo primeiro!');return;}

  var num=(CD.wa||'').replace(/\D/g,'');
  var r=DB.robos.find(function(x){return x.id===CD.roboId;});
  if(r){if(!r.mensagens)r.mensagens=[];r.mensagens.push({data:todayISO(),tipo:'cancelamento'});saveDB();}
  window.open('https://wa.me/55'+num+'?text='+encodeURIComponent(msg),'_blank');

function gerarMsgDiag(r,c){
  var d=r.diagnostico;if(!d)return'';
  var num='#'+String(r.numVisual).padStart(3,'0');
  var L='════════════════════════════';var l='────────────────────────────';
  var msg=L+'\n     🔧 DIAGNÓSTICO TÉCNICO\n'+L+'\nRobô: '+num+' — '+r.modelo+'\nCliente: '+(c?c.nome:'?')+'\nData: '+fmtData(d.data)+'\n';
  if(d.descricao)msg+=l+'\n'+d.descricao+'\n';
  if(d.itens&&d.itens.length){
    msg+=L+'\n         📋 SERVIÇOS\n'+L+'\n';
    d.itens.forEach(function(it){
      var n=it.nome.length>18?it.nome.substring(0,18)+'..':it.nome;
      var v=fmtVal(it.preco);var p='';var tot=28-n.length-v.length;
      for(var i=0;i<Math.max(1,tot);i++)p+='.';
      msg+=n+p+v+'\n';
    });
    if(d.desconto>0)msg+=l+'\nDesconto............-'+fmtVal(d.desconto)+'\n';
    msg+=L+'\nTOTAL...............'+fmtVal(d.total)+'\n'+L+'\n';
    msg+='💰 À vista (PIX/dinheiro): *'+fmtVal(d.avista)+'*\n';
    if(waParcela===0)msg+='💳 Cartão: sob consulta (até 8x)\n';
    else if(waParcela===-1)msg+='💳 Débito: *'+fmtVal(d.total*(1+TAXAS.debito))+'*\n';
    else if(waParcela===1)msg+='💳 Crédito à vista: *'+fmtVal(d.total*(1+TAXAS.c1))+'*\n';
    else{var tx=TAXAS['c'+waParcela]||0;var vC=d.total*(1+tx);msg+='💳 Cartão '+waParcela+'x: *'+fmtVal(vC)+'* ('+waParcela+'x de *'+fmtVal(vC/waParcela)+'*)\n';}
  }
  msg+=L+'\n           🛡️ GARANTIA\n'+L+'\n90 dias sobre o serviço realizado\n'+l+'\nMoLeDo ElEtRoTeCh\nAssistência Técnica · Robôs Aspiradores';
  return msg;
}

function atualizarTotalDiag(){
  var el=document.getElementById('diag-content');if(!el)return;
  var abertura=parseFloat(el.dataset.abertura||200);
  var subtotal=abertura;
  DB.catalogo.forEach(function(cat){
    var chk=document.getElementById('dchk-'+cat.id);var preco=document.getElementById('dpreco-'+cat.id);
    if(chk&&chk.checked&&preco)subtotal+=parseFloat(preco.value)||0;
  });
  var desconto=parseFloat((document.getElementById('diag-desconto')||{}).value)||0;
  var total=Math.max(0,subtotal-desconto);
  el.dataset.total=total;el.dataset.avista=total;el.dataset.desconto=desconto;
  var box=document.getElementById('diag-total-box');
  if(box){
    box.innerHTML='<div class="diag-total-linha"><span>Abertura/Diagnóstico</span><span>'+fmtVal(abertura)+'</span></div>'+
      (desconto>0?'<div class="diag-total-linha desconto"><span>Desconto</span><span>-'+fmtVal(desconto)+'</span></div>':'')+
      '<div class="diag-total-linha total"><span>TOTAL</span><span>'+fmtVal(total)+'</span></div>'+
      '<div class="diag-total-linha avista"><span>💰 À vista (PIX)</span><span>'+fmtVal(total)+'</span></div>'+
      '<div class="diag-total-linha"><span style="color:var(--text3)">💳 Cartão</span><span style="color:var(--text3)">sob consulta (até 8x)</span></div>';
  }
  var calc=document.getElementById('diag-calc-box');
  if(calc&&total>0){
    var vD=total*(1+TAXAS.debito);var vCV=total*(1+TAXAS.c1);
    var tx=TAXAS['c'+parcelaSel]||TAXAS.c2;var vC=total*(1+tx);var vP=vC/parcelaSel;
    var btns=[2,3,4,5,6,7,8].map(function(n){return'<button type="button" class="parcela-btn'+(n===parcelaSel?' sel':'')+'" onclick="selParcela('+n+')">'+n+'x</button>';}).join('');
    calc.innerHTML='<div class="calc-title">CALCULADORA INTERNA — não vai na mensagem</div>'+
      '<div class="calc-row"><span class="calc-label">💳 Débito</span><span class="calc-val">'+fmtVal(vD)+'</span></div>'+
      '<div class="calc-row"><span class="calc-label">💳 Crédito à vista</span><span class="calc-val">'+fmtVal(vCV)+'</span></div>'+
      '<div style="margin:8px 0 4px;font-size:12px;color:var(--text2);font-weight:700;">💳 Crédito parcelado:</div>'+
      '<div class="parcela-btns">'+btns+'</div>'+
      '<div class="calc-row"><span class="calc-label">'+parcelaSel+'x</span><span class="calc-val">'+fmtVal(vC)+' ('+parcelaSel+'x de '+fmtVal(vP)+')</span></div>';
  } else if(calc)calc.innerHTML='<div style="font-size:12px;color:var(--text3);text-align:center;padding:8px;">Adicione itens para ver os valores</div>';
}

}
function renderCheckin(){
  var inp=document.getElementById('ci-data');if(!inp.value)inp.value=todayISO();
  ciQty=1;document.getElementById('ci-qty-val').textContent=1;ciDefects={};generateRobotBlocks();
}
function changeQty(d){
  var novaQty=Math.max(1,Math.min(10,ciQty+d));
  if(novaQty===ciQty)return;
  if(novaQty>ciQty){
    // adicionando — salva dados atuais e adiciona só o novo bloco
    salvarDadosBlocos();
    ciQty=novaQty;
    document.getElementById('ci-qty-val').textContent=ciQty;
    if(!ciDefects[ciQty])ciDefects[ciQty]=[];
    document.getElementById('ci-robots-container').insertAdjacentHTML('beforeend',buildRoboBlock(ciQty));
    restaurarDadosBlocos();
  } else {
    // diminuindo — salva dados, remove só o último bloco
    salvarDadosBlocos();
    var c=document.getElementById('ci-robots-container');
    var blocos=c.querySelectorAll('.robot-block');
    if(blocos.length>0)blocos[blocos.length-1].remove();
    delete ciDefects[ciQty];
    ciQty=novaQty;
    document.getElementById('ci-qty-val').textContent=ciQty;
    restaurarDadosBlocos();
  }
}
function salvarDadosBlocos(){
  for(var i=1;i<=ciQty;i++){
    var sn=document.getElementById('ci-sn-'+i);
    var modelo=document.getElementById('ci-modelo-'+i);
    var obs=document.getElementById('ci-obs-'+i);
    var nosn=document.getElementById('ci-nosn-'+i);
    if(!window._ciCache)window._ciCache={};
    window._ciCache[i]={
      sn:sn?sn.value:'',
      modelo:modelo?modelo.value:'',
      obs:obs?obs.value:'',
      nosn:nosn?nosn.checked:false,
      volt:document.getElementById('vb-ci'+i)?document.getElementById('vb-ci'+i).dataset.volt||'—':'—'
    };
  }
}
function restaurarDadosBlocos(){
  if(!window._ciCache)return;
  for(var i=1;i<=ciQty;i++){
    if(!window._ciCache[i])continue;
    var d=window._ciCache[i];
    var sn=document.getElementById('ci-sn-'+i);
    var modelo=document.getElementById('ci-modelo-'+i);
    var obs=document.getElementById('ci-obs-'+i);
    var nosn=document.getElementById('ci-nosn-'+i);
    if(sn)sn.value=d.sn;
    if(modelo)modelo.value=d.modelo;
    if(obs)obs.value=d.obs;
    if(nosn){nosn.checked=d.nosn;if(d.nosn&&sn){sn.value='';sn.disabled=true;}}
    if(d.volt&&d.volt!=='—'){
      var vb=document.getElementById('vb-ci'+i);
      if(vb){vb.dataset.volt=d.volt;vb.querySelectorAll('.volt-btn').forEach(function(b){if(b.textContent.indexOf(d.volt)!==-1)b.classList.add('sel');else b.classList.remove('sel');});}
    }
    // restaurar defeitos
    if(ciDefects[i]&&ciDefects[i].length){
      var btns=document.querySelectorAll('#ci-robots-container .robot-block:nth-child('+i+') .defect-btn');
      btns.forEach(function(b){if(ciDefects[i].indexOf(b.textContent.trim())!==-1)b.classList.add('sel');});
    }
  }
}
function generateRobotBlocks(){
  var c=document.getElementById('ci-robots-container');c.innerHTML='';
  for(var i=1;i<=ciQty;i++){if(!ciDefects[i])ciDefects[i]=[];c.insertAdjacentHTML('beforeend',buildRoboBlock(i));}
}
function buildRoboBlock(n){
  var num=String(n).padStart(3,'0');
  // usa defeitosCI do DB, ou fallback para DEFEITOS padrão
  var lista=(DB.defeitosCI&&DB.defeitosCI.length)?DB.defeitosCI.filter(function(d){return d.ativo!==false;}):[];
  if(!lista.length){
    DEFEITOS.forEach(function(cat){cat.items.forEach(function(item){lista.push({cat:cat.cat,nome:item});});});
  }
  var catsCI={};
  lista.forEach(function(d){if(!catsCI[d.cat])catsCI[d.cat]=[];catsCI[d.cat].push(d);});

function salvarCheckin(){
  var nome=document.getElementById('ci-nome').value.trim();var wa=document.getElementById('ci-wa').value.trim();var data=document.getElementById('ci-data').value;
  if(!nome){alert('Informe o nome.');return;}if(!wa){alert('Informe o WhatsApp.');return;}if(!data){alert('Informe a data.');return;}
  var nomeCF=ciTipo==='vc'?(document.getElementById('ci-nome-cf').value.trim()||''):'';
  for(var i=1;i<=ciQty;i++){
    var sn=document.getElementById('ci-sn-'+i).value.trim();var noSn=document.getElementById('ci-nosn-'+i).checked;
    if(!sn&&!noSn){alert('Robô #'+String(i).padStart(3,'0')+': Informe o Código/SN.');return;}
  }
  var cliente=null;
  for(var j=0;j<DB.clientes.length;j++){if(DB.clientes[j].whatsapp===wa){cliente=DB.clientes[j];break;}}
  if(!cliente){cliente={id:genId(),nome:nome,whatsapp:wa,tipo:ciTipo,nomeClienteFinal:nomeCF};DB.clientes.push(cliente);}
  else{cliente.nome=nome;cliente.tipo=ciTipo;cliente.nomeClienteFinal=nomeCF;}
  var ativos=DB.robos.filter(function(r){return r.clienteId===cliente.id&&(r.status==='reparo'||r.status==='garantia');});
  var nextNum=ativos.length?Math.max.apply(null,ativos.map(function(r){return r.numVisual;}))+1:1;
  for(var k=1;k<=ciQty;k++){
    DB.robos.push({id:genId(),clienteId:cliente.id,numVisual:nextNum+(k-1),
      sn:document.getElementById('ci-nosn-'+k).checked?'SEM CÓDIGO':document.getElementById('ci-sn-'+k).value.trim(),
      modelo:document.getElementById('ci-modelo-'+k).value.trim()||'—',
      voltagem:getVolt('ci'+k),defeitos:[].concat(ciDefects[k]||[]),
      obs:document.getElementById('ci-obs-'+k).value.trim(),
      dataEntrada:data,status:'reparo',dataEntrega:null,garantiaAte:null,mensagens:[],diagnostico:null});
  }
  saveDB();
  document.getElementById('ci-nome').value='';document.getElementById('ci-wa').value='';document.getElementById('ci-data').value='';
  if(document.getElementById('ci-nome-cf'))document.getElementById('ci-nome-cf').value='';
  ciQty=1;ciDefects={};ciTipo='cf';document.getElementById('ci-qty-val').textContent=1;
  setTipoCliente('cf');generateRobotBlocks();
  renderAll();switchTab('fila');showToast('✅ Check-in salvo!');
}

function autocompleteModelo(input,n){
  var val=input.value.trim();
  var box=document.getElementById('ci-modelo-ac-'+n);
  if(!val||val.length<2){if(box)box.style.display='none';return;}
  var lista=(DB.modelosCustom||[]).concat(MODELOS_PAD);
  var matches=lista.filter(function(m){return m.toLowerCase().indexOf(val.toLowerCase())!==-1;});
  if(!matches.length){if(box)box.style.display='none';return;}
  box.innerHTML=matches.slice(0,6).map(function(m){
    return'<div onclick="selecionarModelo(\''+n+'\',\''+m.replace(/'/g,"\\'")+'\')" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;color:var(--text);font-family:\'Rajdhani\',sans-serif;font-weight:600;">'+esc(m)+'</div>';
  }).join('');
  box.style.display='block';
}
function selecionarModelo(n,modelo){
  var inp=document.getElementById('ci-modelo-'+n);
  var box=document.getElementById('ci-modelo-ac-'+n);
  if(inp)inp.value=modelo;
  if(box)box.style.display='none';
}

function tvIniciarRoomba(){
  var canvas=document.getElementById('tv-roomba-canvas');
  if(!canvas)return;
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  var pos=0; // 0=top, 1=right, 2=bottom, 3=left
  var x=0,y=0,speed=2;
  var perimeter=2*(W+H);
  var dist=0;
  var cores=['#00e676','#ffd600','#ff6d00','#ff1744'];
  var coreIdx=0;
  var trail=[];
  function step(){
    dist+=speed;
    if(dist>perimeter)dist=0;
    // posição na borda
    if(dist<W){x=dist;y=0;}
    else if(dist<W+H){x=W;y=dist-W;}
    else if(dist<2*W+H){x=W-(dist-W-H);y=H;}
    else{x=0;y=H-(dist-2*W-H);}
    // muda cor gradualmente
    var t=dist/perimeter;
    var ci=Math.floor(t*cores.length)%cores.length;
    if(ci!==coreIdx){coreIdx=ci;}
    trail.push({x:x,y:y,cor:cores[coreIdx]});
    if(trail.length>120)trail.shift();
    ctx.clearRect(0,0,W,H);
    // desenha rastro
    for(var i=0;i<trail.length;i++){
      var alpha=(i/trail.length)*0.6;
      ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,3,0,Math.PI*2);
      ctx.fillStyle=trail[i].cor;ctx.globalAlpha=alpha;ctx.fill();
    }
    ctx.globalAlpha=1;
    // desenha robô (círculo com detalhes)
    ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);
    ctx.fillStyle='#111';ctx.fill();
    ctx.strokeStyle=cores[coreIdx];ctx.lineWidth=2;ctx.stroke();
    // botão centro
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle=cores[coreIdx];ctx.fill();
    // escovinha
    var ang=Math.atan2(y-H/2,x-W/2);
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(ang+0.5)*12,y+Math.sin(ang+0.5)*12);
    ctx.lineTo(x+Math.cos(ang+0.8)*18,y+Math.sin(ang+0.8)*18);
    ctx.strokeStyle=cores[coreIdx];ctx.lineWidth=2;ctx.globalAlpha=0.7;ctx.stroke();
    ctx.globalAlpha=1;
  }
  window._tvRoombaInterval=setInterval(step,16);
}

function tvMover(roboId,destino){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var hoje=new Date();hoje.setHours(0,0,0,0);
  var entrada=r.dataEntrada?new Date(r.dataEntrada+'T00:00:00'):null;
  var dias=entrada?Math.floor((hoje-entrada)/(1000*60*60*24)):0;
  var stAtual=_tvStatusMap[roboId]||'fila';
  // aviso se mover de vermelho/amarelo para fila
  if((stAtual==='vermelho'||stAtual==='amarelo')&&destino==='fila'){
    if(!confirm('Este robô está há '+dias+' dias. Mover de volta para a fila?'))return;
  }
  // aviso se mover da fila para amarelo (fura fila)
  if(stAtual==='fila'&&destino==='amarelo'){
    var temAmarelo=DB.robos.some(function(x){return (_tvStatusMap[x.id]||'fila')==='amarelo';});
    if(temAmarelo&&!confirm('Já tem robô marcado como próximo. Quer colocar este na frente?'))return;
  }
  _tvStatusMap[roboId]=destino;
  tvSalvarStatus();
  tvFecharDetalhe();
  renderModoTV();
}

    '.dias{font-weight:700;padding:2px 8px;border-radius:4px;}'+
    '.ok{background:#e8f5e9;color:#2e7d32;}'+
    '.atencao{background:#fff8e1;color:#f57f17;}'+
    '.atraso{background:#fce4ec;color:#c62828;}'+
    'small{color:#888;font-size:11px;}'+
    '.total{margin-top:16px;font-size:13px;color:#555;text-align:right;}'+
    '@media print{body{padding:10px;}button{display:none!important;}}'+
    '</style></head><body>'+
    '<h1>📋 MoLeDo ElEtRoTeCh</h1>'+
    '<div class="sub">Relatório gerado em '+hoje.toLocaleDateString('pt-BR')+' — '+totalRobos+' robô(s) em reparo/garantia</div>'+
    '<button onclick="window.print()" style="margin-bottom:16px;padding:8px 16px;background:#007ea8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">🖨️ Imprimir</button>'+
    '<table><thead><tr><th>#</th><th>Modelo</th><th>Tempo</th><th>Status</th><th>Diagnóstico / Defeitos</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table>'+
    '<div class="total">Total: <b>'+totalRobos+' robôs</b> em acompanhamento</div>'+
    '</body></html>';
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  window.open(url,'_blank');
  setTimeout(function(){URL.revokeObjectURL(url);},10000);
  showToast('📋 Relatório aberto!');
}

// Adiciona botão de logout no header
function addLogoutBtn(){
  var header=document.getElementById('app-header');
  if(header&&!document.getElementById('btn-logout')){
    var btn=document.createElement('button');
    btn.id='btn-logout';btn.textContent='🔓 Sair';
    btn.style.cssText='position:absolute;top:10px;right:10px;background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.3);color:#ff1744;border-radius:6px;padding:4px 10px;font-family:\'Rajdhani\',sans-serif;font-size:11px;font-weight:700;cursor:pointer;z-index:10;';
    btn.onclick=function(){signOut(auth);};header.appendChild(btn);
    var btnTV=document.createElement('button');
    btnTV.id='btn-tv';btnTV.textContent='📺 TV';
    btnTV.style.cssText='position:absolute;top:38px;right:148px;background:rgba(255,214,0,.1);border:1px solid rgba(255,214,0,.3);color:#ffd600;border-radius:6px;padding:4px 10px;font-family:\'Rajdhani\',sans-serif;font-size:11px;font-weight:700;cursor:pointer;z-index:10;';
    btnTV.onclick=abrirModoTV;header.appendChild(btnTV);
    var btnRel=document.createElement('button');
    btnRel.id='btn-relatorio';btnRel.textContent='📋';
    btnRel.style.cssText='position:absolute;top:38px;right:10px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:var(--cyan);border-radius:6px;padding:4px 10px;font-family:\'Rajdhani\',sans-serif;font-size:13px;font-weight:700;cursor:pointer;z-index:10;';
    btnRel.onclick=gerarRelatorio;header.appendChild(btnRel);
    var btnBusca=document.createElement('button');
    btnBusca.id='btn-busca';btnBusca.textContent='🔍';
    btnBusca.style.cssText='position:absolute;top:38px;right:50px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:var(--cyan);border-radius:6px;padding:4px 10px;font-family:\'Rajdhani\',sans-serif;font-size:13px;font-weight:700;cursor:pointer;z-index:10;';
    btnBusca.onclick=toggleBusca;header.appendChild(btnBusca);
    var contador=document.createElement('div');
    contador.id='app-contador';
    contador.style.cssText='position:absolute;bottom:4px;left:10px;display:flex;gap:4px;z-index:10;flex-wrap:wrap;';
    header.appendChild(contador);
    renderContador();
  }
}

onAuthStateChanged(auth,function(user){
  if(user){
    // Logado
    var overlay=document.getElementById('login-overlay');
    if(overlay)overlay.remove();
    window._fbReady=true;
    addLogoutBtn();
    loadFromFirebase();
  } else {
    // Deslogado
    window._fbReady=false;
    var btn=document.getElementById('btn-logout');
    if(btn)btn.remove();
    mostrarLogin();
  }
});
</script>
