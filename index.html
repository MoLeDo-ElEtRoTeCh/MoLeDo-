function tvIniciarRoomba(){
  var canvas=document.getElementById('tv-roomba-canvas');
  if(!canvas)return;
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  var ctx=canvas.getContext('2d');
  var W=canvas.width,H=canvas.height;
  var pos=0; // 0=top, 1=right, 2=bottom, 3=left
  var x=0,y=0,speed=2;
  var perimeter=2*(W+H);
  var dist=0;
  var cores=['#00e676','#ffd600','#ff6d00','#ff1744'];
  var coreIdx=0;
  var trail=[];
  function step(){
    dist+=speed;
    if(dist>perimeter)dist=0;
    // posição na borda
    if(dist<W){x=dist;y=0;}
    else if(dist<W+H){x=W;y=dist-W;}
    else if(dist<2*W+H){x=W-(dist-W-H);y=H;}
    else{x=0;y=H-(dist-2*W-H);}
    // muda cor gradualmente
    var t=dist/perimeter;
    var ci=Math.floor(t*cores.length)%cores.length;
    if(ci!==coreIdx){coreIdx=ci;}
    trail.push({x:x,y:y,cor:cores[coreIdx]});
    if(trail.length>120)trail.shift();
    ctx.clearRect(0,0,W,H);
    // desenha rastro
    for(var i=0;i<trail.length;i++){
      var alpha=(i/trail.length)*0.6;
      ctx.beginPath();ctx.arc(trail[i].x,trail[i].y,3,0,Math.PI*2);
      ctx.fillStyle=trail[i].cor;ctx.globalAlpha=alpha;ctx.fill();
    }
    ctx.globalAlpha=1;
    // desenha robô (círculo com detalhes)
    ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);
    ctx.fillStyle='#111';ctx.fill();
    ctx.strokeStyle=cores[coreIdx];ctx.lineWidth=2;ctx.stroke();
    // botão centro
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle=cores[coreIdx];ctx.fill();
    // escovinha
    var ang=Math.atan2(y-H/2,x-W/2);
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(ang+0.5)*12,y+Math.sin(ang+0.5)*12);
    ctx.lineTo(x+Math.cos(ang+0.8)*18,y+Math.sin(ang+0.8)*18);
    ctx.strokeStyle=cores[coreIdx];ctx.lineWidth=2;ctx.globalAlpha=0.7;ctx.stroke();
    ctx.globalAlpha=1;
  }
  window._tvRoombaInterval=setInterval(step,16);
}

function tvMover(roboId,destino){
  var r=DB.robos.find(function(x){return x.id===roboId;});if(!r)return;
  var hoje=new Date();hoje.setHours(0,0,0,0);
  var entrada=r.dataEntrada?new Date(r.dataEntrada+'T00:00:00'):null;
  var dias=entrada?Math.floor((hoje-entrada)/(1000*60*60*24)):0;
  var stAtual=_tvStatusMap[roboId]||'fila';
  // aviso se mover de vermelho/amarelo para fila
  if((stAtual==='vermelho'||stAtual==='amarelo')&&destino==='fila'){
    if(!confirm('Este robô está há '+dias+' dias. Mover de volta para a fila?'))return;
  }
  // aviso se mover da fila para amarelo (fura fila)
  if(stAtual==='fila'&&destino==='amarelo'){
    var temAmarelo=DB.robos.some(function(x){return (_tvStatusMap[x.id]||'fila')==='amarelo';});
    if(temAmarelo&&!confirm('Já tem robô marcado como próximo. Quer colocar este na frente?'))return;
  }
  _tvStatusMap[roboId]=destino;
  tvSalvarStatus();
  tvFecharDetalhe();
  renderModoTV();
}

function abrirFichaCliente(roboId){
  var el=document.getElementById('qr-escolha-overlay');
  if(el)el.remove();
  // Busca dados públicos do Firebase
  var logoImgs=document.querySelectorAll('img[alt="MoLeDo ElEtRoTeCh"]');
  var logoSrc=logoImgs.length?logoImgs[0].src:'';
  // Mostra animação enquanto carrega
  var loading=document.createElement('div');
  loading.id='pub-loading';
  loading.style.cssText='position:fixed;inset:0;background:#0a0c10;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  loading.innerHTML=
    (logoSrc?'<img src="'+logoSrc+'" style="width:100%;max-width:400px;display:block;margin:0 auto 20px;">':'')+
    '<div style="font-size:15px;color:#00b8d9;letter-spacing:2px;text-align:center;margin-bottom:20px;">REPARO É NOSSA LINGUAGEM · TECNOLOGIA É NOSSA PAIXÃO</div>'+
    '<div style="font-size:22px;font-weight:700;color:#fff;text-align:center;margin-bottom:8px;">🙏 Muito obrigado por confiar em nós!</div>';
  document.body.appendChild(loading);
  // Busca do Firebase após 4 segundos de animação
  setTimeout(function(){
    import('https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js').then(function(fs){
      import('https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js').then(function(fa){
        var apps=fa.getApps?fa.getApps():[];
        var app2=apps.length?apps[0]:null;
        if(!app2){var lo=document.getElementById('pub-loading');if(lo)lo.remove();mostrarFichaClienteSimples(roboId,logoSrc);return;}
        var db2=fs.getFirestore(app2);
        fs.getDoc(fs.doc(db2,'publico',roboId)).then(function(snap){
          var lo=document.getElementById('pub-loading');if(lo)lo.remove();
          if(snap.exists()){mostrarFichaClienteCompleta(snap.data(),logoSrc);}
          else{mostrarFichaClienteSimples(roboId,logoSrc);}
        }).catch(function(){
          var lo=document.getElementById('pub-loading');if(lo)lo.remove();
          mostrarFichaClienteSimples(roboId,logoSrc);
        });
      });
    }).catch(function(){
      var lo=document.getElementById('pub-loading');if(lo)lo.remove();
      mostrarFichaClienteSimples(roboId,logoSrc);
    });
  },4000);
}
