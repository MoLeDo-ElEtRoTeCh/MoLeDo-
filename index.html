          <line x1="11" y1="29" x2="7" y2="31" stroke="#00e5ff" stroke-width="1" opacity=".5"/>
        </svg>
      </div>
    </div>

    <div class="sync-dots" style="margin-top:10px"><span></span><span></span><span></span></div>
  </div>
</div>

const firebaseConfig={
  apiKey:"AIzaSyBft8GBl62cjjloFXPD6YGWQ1ZGAj3-974",
  authDomain:"moledo-eletrotech.firebaseapp.com",
  projectId:"moledo-eletrotech",
  storageBucket:"moledo-eletrotech.firebasestorage.app",

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

// Ponte mínima para o fluxo Zebra. O token fica somente em memória e nunca é salvo.
window._getPrintCurrentUid=function(){return auth.currentUser?auth.currentUser.uid:null;};
window._getPrintAuthContext=async function(forceRefresh){
  const user=auth.currentUser;
  if(!user)throw Object.assign(new Error('LOGIN_NECESSARIO'),{code:'LOGIN_NECESSARIO'});
  const uid=user.uid;
  const token=await user.getIdToken(!!forceRefresh);
  if(!auth.currentUser||auth.currentUser.uid!==uid)throw Object.assign(new Error('USUARIO_ALTERADO'),{code:'USUARIO_ALTERADO'});
  return {uid:uid,token:token};
};

function gerarRelatorio(filtro){
  filtro=filtro||['fila','bancada','diagnostico','finalizados'];
  var hoje=new Date();hoje.setHours(0,0,0,0);
  // Filtrar robôs conforme seleção (array)
  var filtros=Array.isArray(filtro)?filtro:[filtro];
  var robosBase=DB.robos.filter(function(r){
    if(filtros.indexOf('fila')!==-1&&r.status==='reparo'&&!r.bancada&&!r.entradaBancada&&!r.diagnostico)return true;
    if(filtros.indexOf('bancada')!==-1&&r.status==='reparo'&&(r.bancada||r.entradaBancada)&&!r.diagnostico)return true;
    if(filtros.indexOf('diagnostico')!==-1&&r.status==='reparo'&&r.diagnostico)return true;
    if(filtros.indexOf('finalizados')!==-1&&r.status==='garantia')return true;
    return false;
  });
  var clientes=[...DB.clientes].sort(function(a,b){return a.nome.localeCompare(b.nome);});
  var totalRobos=robosBase.length;
  var rows='';
  clientes.forEach(function(c){
    var robos=robosBase.filter(function(r){return r.clienteId===c.id;});
    if(!robos.length)return;
    var tipoLabel=c.tipo==='vd'?'🏪 Vendedor':c.tipo==='vc'?'🤝 Vend+Cliente':'👤 Cliente';
    rows+='<tr class="cliente-row"><td colspan="5"><b>'+esc(c.nome)+'</b> <span class="tipo">'+tipoLabel+'</span> <span class="wa">📱 '+esc(c.whatsapp)+'</span></td></tr>';
    robos.forEach(function(r){
      var entrada=r.dataEntrada?new Date(r.dataEntrada+'T00:00:00'):null;
      var dias=entrada?Math.floor((hoje-entrada)/(1000*60*60*24)):'-';
      var diasCls=dias>40?'atraso':dias>20?'atencao':'ok';
      var status=r.status==='garantia'?'🛡️ Garantia':'🔧 Reparo';
      var diag=r.diagnostico?'✅ Diagnóstico enviado':'⏳ Aguardando';
      var defeitos=r.defeitos&&r.defeitos.length?r.defeitos.join(', '):'—';
      rows+='<tr>'+
        '<td><span class="num">#'+String(r.numVisual).padStart(3,'0')+'</span></td>'+
        '<td>'+esc(r.modelo||'—')+'</td>'+
        '<td><span class="dias '+diasCls+'">'+dias+' dias</span></td>'+
        '<td>'+status+'</td>'+
        '<td>'+diag+'<br><small>'+defeitos+'</small></td>'+
      '</tr>';
    });
  });
  if(!rows){showToast('Nenhum robô em reparo!');return;}
  var html='<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">'+
    '<title>Relatório MoLeDo ElEtRoTeCh</title>'+
    '<style>*{margin:0;padding:0;box-sizing:border-box;}body{font-family:Arial,sans-serif;padding:20px;color:#111;}'+
    'h1{font-size:22px;color:#007ea8;margin-bottom:4px;}'+
    '.sub{font-size:13px;color:#555;margin-bottom:20px;}'+
    'table{width:100%;border-collapse:collapse;font-size:13px;}'+
    'th{background:#007ea8;color:#fff;padding:8px 10px;text-align:left;}'+
    'td{padding:7px 10px;border-bottom:1px solid #e0e0e0;vertical-align:top;}'+
    'tr:hover td{background:#f5f5f5;}'+
    '.cliente-row td{background:#e8f4f8;font-size:14px;padding:10px;border-top:2px solid #007ea8;}'+
    '.tipo{font-size:11px;background:#e0f0ff;color:#007ea8;border-radius:4px;padding:1px 6px;margin-left:6px;}'+
    '.wa{font-size:12px;color:#555;margin-left:8px;}'+
    '.num{font-family:monospace;font-weight:700;color:#007ea8;}'+
    '.dias{font-weight:700;padding:2px 8px;border-radius:4px;}'+
    '.ok{background:#e8f5e9;color:#2e7d32;}'+
    '.atencao{background:#fff8e1;color:#f57f17;}'+
    '.atraso{background:#fce4ec;color:#c62828;}'+
    'small{color:#888;font-size:11px;}'+
    '.total{margin-top:16px;font-size:13px;color:#555;text-align:right;}'+
    '@media print{body{padding:10px;}button{display:none!important;}}'+
    '</style></head><body>'+
    '<h1>📋 MoLeDo ElEtRoTeCh</h1>'+
    '<div class="sub">Relatório gerado em '+hoje.toLocaleDateString('pt-BR')+' — '+totalRobos+' robô(s)</div>'+
    '<button onclick="window.print()" style="margin-bottom:16px;padding:8px 16px;background:#007ea8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;">🖨️ Imprimir</button>'+
    '<table><thead><tr><th>#</th><th>Modelo</th><th>Tempo</th><th>Status</th><th>Diagnóstico / Defeitos</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table>'+
    '<div class="total">Total: <b>'+totalRobos+' robôs</b> em acompanhamento</div>'+
    '</body></html>';
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var w=window.open(url,'_blank');
  if(!w){
    // Popup bloqueado pelo navegador — abrir na mesma aba
    window.location.href=url;
    return;
  }
  setTimeout(function(){URL.revokeObjectURL(url);},10000);
  showToast('📋 Relatório aberto!');
}

let acessoSeq=0;
let acessoExpiracao=null;
let interfacePreparada=false;
async function validarAcesso(user){
  const seq=++acessoSeq;
  clearTimeout(acessoExpiracao);
  window._bloquearAcesso('Validando acesso...');
  if(!user||!navigator.onLine){
    window._bloquearAcesso(user?'Sem conexão. Não foi possível validar o acesso.':'Faça login para acessar.');
    return false;
  }
  let limite;
  try{
    const token=await Promise.race([
      user.getIdToken(true),
      new Promise((_,reject)=>{limite=setTimeout(()=>reject(new Error('VALIDACAO_TIMEOUT')),15000);})
    ]);
    if(!token)throw new Error('SESSAO_NAO_VALIDADA');
    if(seq!==acessoSeq||!navigator.onLine||auth.currentUser!==user)return false;
    document.documentElement.setAttribute('data-access-validado','sim');
    acessoExpiracao=setTimeout(()=>window._validarAcessoAtual(),50*60*1000);
    return true;
  }catch(e){
    if(seq===acessoSeq)window._bloquearAcesso('Sem conexão. Não foi possível validar o acesso.');
    return false;
  }finally{clearTimeout(limite);}
}
function liberarAcessoValidado(){
  var overlay=document.getElementById('login-overlay');if(overlay)overlay.remove();
  var qrOverlay=document.getElementById('qr-escolha-overlay');if(qrOverlay)qrOverlay.remove();
  window._fbReady=true;
  if(!interfacePreparada){
    interfacePreparada=true;
    addLogoutBtn();
    criarBotaoFlutuante();
    verificarBackupSemanal();
    loadFromFirebase();
  }
}
window._validarAcessoAtual=async function(){
  if(await validarAcesso(auth.currentUser))liberarAcessoValidado();
};
onAuthStateChanged(auth,async function(user){
  if(user){
    // A sessao em cache so libera a interface depois da validacao online.
    if(!await validarAcesso(user))return;
    liberarAcessoValidado();
  } else {
    // Não logado
    ++acessoSeq;clearTimeout(acessoExpiracao);interfacePreparada=false;
    window._bloquearAcesso('Faça login para acessar.');
    window._fbReady=false;
    if(window.zebraPararPolling)window.zebraPararPolling();
    if(window.zebraPararLoteTimer)window.zebraPararLoteTimer();
    var btn=document.getElementById('btn-logout');
    if(btn)btn.remove();
    // Se veio de QR → mostra escolha Cliente/Técnico
    if(window._qrRoboId){
      mostrarEscolhaQR(window._qrRoboId);
    } else {
      mostrarLogin();
    }
  }
},function(){++acessoSeq;clearTimeout(acessoExpiracao);window._bloquearAcesso('Sem conexão. Não foi possível validar o acesso.');});

function abrirFichaCliente(roboId){
  var el=document.getElementById('qr-escolha-overlay');
  if(el)el.remove();
  // Busca dados públicos do Firebase
  var logoImgs=document.querySelectorAll('img[alt="MoLeDo ElEtRoTeCh"]');
  var logoSrc=logoImgs.length?logoImgs[0].src:'';
  // Mostra animação enquanto carrega
  var loading=document.createElement('div');
  loading.id='pub-loading';
  loading.style.cssText='position:fixed;inset:0;background:#0a0c10;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  loading.innerHTML=
    (logoSrc?'<img src="'+logoSrc+'" style="width:100%;max-width:400px;display:block;margin:0 auto 20px;">':'')+
    '<div style="font-size:15px;color:#00b8d9;letter-spacing:2px;text-align:center;margin-bottom:20px;">REPARO É NOSSA LINGUAGEM · TECNOLOGIA É NOSSA PAIXÃO</div>'+
    '<div style="font-size:22px;font-weight:700;color:#fff;text-align:center;margin-bottom:8px;">🙏 Muito obrigado por confiar em nós!</div>';
  document.body.appendChild(loading);
  // Busca do Firebase após 4 segundos de animação
  setTimeout(function(){
    import('https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js').then(function(fs){
      import('https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js').then(function(fa){
        var apps=fa.getApps?fa.getApps():[];
        var app2=apps.length?apps[0]:null;
        if(!app2){var lo=document.getElementById('pub-loading');if(lo)lo.remove();mostrarFichaClienteSimples(roboId,logoSrc);return;}
        var db2=fs.getFirestore(app2);
